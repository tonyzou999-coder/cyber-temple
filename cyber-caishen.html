<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>赛博神殿 · CyberTemple</title>

<!-- 字体预加载（防FOIT） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="赛博神殿">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="赛博朋克风格祈福应用，财神·月老·天公，一键祈福">
<style>
  :root {
    --c1: #FFD700;
    --c2: #FF2D55;
    --c3: #00FFFF;
    --bg: #050010;
    --deity-hue: 40;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    position: relative;
    transition: background 0.6s ease;
  }

  /* ===== 页面主滚动容器 ===== */
  #app-scroll {
    flex: 1;
    width: 100%;
    height: 0; /* 配合 flex:1 精确填满剩余高度（手机端） */
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    position: relative;
  }
  #app-scroll::-webkit-scrollbar { display: none; }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    transition: background-image 0.6s;
  }

  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  #flash-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    transition: opacity 0.15s;
    border-radius: 0;
  }
  #flash-overlay.active { opacity: 1; }

  /* ===== 左右切换导航 ===== */
  .nav-row {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: clamp(6px, 1.5vh, 14px) 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .nav-arrow {
    width: clamp(36px, 5.5vw, 44px);
    height: clamp(36px, 5.5vw, 44px);
    border: 1px solid var(--deity-border);
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: var(--deity-primary);
    font-size: clamp(15px, 2.2vw, 18px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 10px var(--deity-glow);
    flex-shrink: 0;
  }

  .nav-arrow:hover { background: rgba(255,255,255,0.08); transform: scale(1.1); }
  .nav-arrow:active { transform: scale(0.92); }

  .nav-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    padding: 0 10px;
  }

  .nav-deity-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--deity-primary);
    text-shadow: 0 0 10px var(--deity-glow);
    letter-spacing: 2px;
    transition: all 0.4s;
  }

  /* 指示点 */
  .nav-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .nav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .nav-dot.active {
    width: 18px;
    border-radius: 3px;
    background: var(--deity-primary);
    box-shadow: 0 0 8px var(--deity-primary);
  }

  /* ===== 主体容器 ===== */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.6vh, 18px);
    padding: clamp(6px, 1vh, 12px) 16px clamp(16px, 2vh, 28px);
    max-width: 420px;
    width: 100%;
    flex: 1;
  }

  /* ===== 标题区 ===== */
  .title-area { text-align: center; flex-shrink: 0; }

  .subtitle {
    font-size: clamp(9px, 1.2vh, 10px);
    letter-spacing: 5px;
    color: var(--deity-secondary);
    text-shadow: 0 0 8px var(--deity-secondary);
    margin-bottom: clamp(2px, 0.5vh, 6px);
    opacity: 0.8;
    transition: all 0.5s;
  }

  .title {
    font-size: clamp(26px, 5vh, 36px);
    font-weight: 900;
    line-height: 1.1;
    transition: all 0.5s;
    background: linear-gradient(160deg, #ffffff 30%, var(--deity-primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 18px var(--deity-glow)) drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  }

  .title-en {
    font-size: clamp(9px, 1.2vh, 11px);
    letter-spacing: 3px;
    margin-top: clamp(2px, 0.4vh, 4px);
    color: var(--deity-primary);
    opacity: 0.5;
    transition: all 0.5s;
  }

  /* ===== 神像区 ===== */
  .deity-frame {
    position: relative;
    width: clamp(150px, 26vh, 200px);
    height: clamp(150px, 26vh, 200px);
    perspective: 600px;
    flex-shrink: 0;
  }

  #deityTiltWrap {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: rotateX(0deg) rotateY(0deg);
    transition: transform 0.1s ease-out;
  }

  .halo-outer {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    animation: halo-spin 4s linear infinite;
    transition: background 0.6s;
  }

  .halo-outer::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--deity-halo) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
  }

  .halo-inner {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid var(--deity-primary);
    opacity: 0.3;
    box-shadow: inset 0 0 30px var(--deity-glow);
    transition: all 0.6s;
  }

  @keyframes halo-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .deity-inner {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1a0a2e, #050010);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.6s;
  }

  .deity-svg-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    transition: filter 0.3s;
  }

  .deity-svg-wrap.blessed {
    filter: drop-shadow(0 0 20px var(--deity-primary)) drop-shadow(0 0 40px var(--deity-glow));
    animation: deity-glow-anim 0.5s ease-out;
  }

  @keyframes deity-glow-anim {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .deity-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deity-img.visible { opacity: 1; }

  .count-display {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    border: 1px solid var(--deity-primary);
    border-radius: 20px;
    padding: 3px 14px;
    font-size: 10px;
    color: var(--deity-primary);
    white-space: nowrap;
    text-shadow: 0 0 6px var(--deity-primary);
    box-shadow: 0 0 10px var(--deity-glow);
    transition: all 0.5s;
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(9px, 1.2vh, 10px);
    color: var(--deity-secondary);
    opacity: 0.7;
    letter-spacing: 2px;
    transition: all 0.5s;
    flex-shrink: 0;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--deity-secondary);
    box-shadow: 0 0 6px var(--deity-secondary);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* ===== 祝福语区 ===== */
  .blessing-box {
    width: 100%;
    min-height: clamp(64px, 10vh, 84px);
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--deity-border);
    border-radius: 12px;
    padding: clamp(10px, 1.6vh, 16px) 18px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.5s;
    flex-shrink: 0;
  }

  .blessing-box::before {
    content: attr(data-label);
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg);
    padding: 0 10px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--deity-secondary);
    text-shadow: 0 0 6px var(--deity-secondary);
    white-space: nowrap;
    transition: all 0.5s;
  }

  .blessing-idle {
    font-size: 12px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 3px;
    text-align: center;
  }

  .blessing-text {
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: var(--deity-primary);
    text-shadow: 0 0 12px var(--deity-glow);
    line-height: 1.7;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.5s ease;
    letter-spacing: 0.5px;
    display: none;
  }

  .blessing-text.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== 祈福按键 ===== */

  .btn-bg {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    background: var(--deity-btn-bg);
    box-shadow: 0 0 20px var(--deity-glow), 0 0 40px var(--deity-shadow), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: all 0.3s ease;
  }

  .btn-border {
    position: absolute;
    inset: -2px;
    border-radius: 32px;
    background: var(--deity-btn-border);
    z-index: -1;
    animation: border-pulse 2s ease-in-out infinite;
  }

  @keyframes border-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  .btn-main-text {
    position: relative;
    z-index: 1;
    font-size: clamp(17px, 2.5vh, 20px);
    font-weight: 900;
    color: var(--deity-primary);
    text-shadow: 0 0 10px var(--deity-glow), 0 2px 4px rgba(0,0,0,0.5);
    letter-spacing: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    transition: all 0.5s;
  }

  .btn-worship:active .btn-bg {
    transform: scale(0.95);
    box-shadow: 0 0 8px var(--deity-glow), inset 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ===== 底部 ===== */
  .footer-deco {
    font-size: 10px;
    color: rgba(255,255,255,0.12);
    letter-spacing: 3px;
    text-align: center;
  }

  /* ===== 漂浮特效 ===== */
  .floater {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    animation: floater-up 2s ease-out forwards;
    font-size: 20px;
  }

  @keyframes floater-up {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(-160px) rotate(540deg) scale(0.2); }
  }

  .matrix-drop {
    position: fixed;
    font-size: 14px;
    font-family: monospace;
    pointer-events: none;
    z-index: 3;
    animation: matrix-fall 1.5s linear forwards;
  }

  @keyframes matrix-fall {
    0% { opacity: 0.8; transform: translateY(-20px); }
    100% { opacity: 0; transform: translateY(80px); }
  }

  /* ===== 切换动画 ===== */
  .container.slide-left {
    animation: slide-from-right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .container.slide-right {
    animation: slide-from-left 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  @keyframes slide-from-right {
    0%  { opacity: 0; transform: translateX(40px) scale(0.97); }
    100%{ opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes slide-from-left {
    0%  { opacity: 0; transform: translateX(-40px) scale(0.97); }
    100%{ opacity: 1; transform: translateX(0) scale(1); }
  }

  /* ===== 手机端（≤480px）：全屏自适应，保持原有行为 ===== */
  @media (max-width: 480px) {
    body {
      height: 100vh;
      overflow: hidden;
      justify-content: flex-start;
    }
    #app-scroll {
      width: 100%;
      height: 0;
      border-radius: 0;
      box-shadow: none;
    }
  }

  @media (max-width: 400px) {
    .deity-frame { width: clamp(130px, 22vh, 170px); height: clamp(130px, 22vh, 170px); }
    .title { font-size: clamp(22px, 4.5vh, 30px); }
    .nav-arrow { width: 36px; height: 36px; font-size: 15px; }
  }

  /* 超矮屏（高度 < 680px，如 iPhone SE / 折叠屏外屏）额外压缩 */
  @media (max-height: 680px) and (max-width: 480px) {
    .container { gap: clamp(6px, 1.2vh, 10px); }
    .blessing-box { min-height: 56px; padding: 8px 16px; }
    .deity-frame { width: clamp(130px, 22vh, 160px); height: clamp(130px, 22vh, 160px); }
    .title { font-size: clamp(22px, 4vh, 28px); }
    #deity-affinity-bar { margin-top: -4px; }
    .status-bar { display: none; }
  }

  /* ===== 电脑端（>480px）：手机壳容器，居中展示 ===== */
  @media (min-width: 481px) {
    body {
      height: 100vh;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      background: #020008;
    }

    /* 手机外壳容器 */
    #app-scroll {
      width: 390px;
      height: min(820px, 90vh);
      flex: none;
      /* 重置手机端的 height:0 */
      overflow-y: auto;
      overflow-x: hidden;
      border-radius: 40px;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow:
        0 0 0 8px rgba(255,255,255,0.03),
        0 30px 80px rgba(0,0,0,0.9),
        0 0 40px var(--deity-glow, rgba(255,215,0,0.15)),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      position: relative;
    }

    /* 顶部刘海装饰 */
    #app-scroll::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 6px;
      background: rgba(0,0,0,0.9);
      border-radius: 3px;
      z-index: 200;
      pointer-events: none;
    }

    /* 调整内部元素宽度填满手机框 */
    .container,
    .nav-row,
    #recommend-banner,
    #today-wuxing-bar {
      max-width: 100%;
    }

    /* 电脑端 nav-row 顶部给刘海留空间 */
    .nav-row {
      padding-top: clamp(24px, 3vh, 32px);
    }
  }

  /* 超高分辨率大屏：手机壳稍大一点 */
  @media (min-width: 481px) and (min-height: 900px) {
    #app-scroll {
      width: 420px;
      height: min(860px, 90vh);
    }
  }

  /* ===== 命盘录入页 ===== */
  #onboarding-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #03030f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  #onboarding-screen.hidden {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }

  .ob-scan-line {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,229,255,0.04) 2px, rgba(0,229,255,0.04) 4px
    );
    pointer-events: none;
    animation: scan-move 8s linear infinite;
  }

  @keyframes scan-move {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .ob-logo {
    font-size: 40px;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 16px rgba(255,215,0,0.6));
    animation: ob-float 3s ease-in-out infinite;
  }

  @keyframes ob-float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .ob-title {
    font-size: 22px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255,215,0,0.7);
    letter-spacing: 4px;
    text-align: center;
  }

  .ob-subtitle {
    font-size: 11px;
    color: rgba(0,229,255,0.7);
    letter-spacing: 3px;
    margin-top: 4px;
    margin-bottom: 28px;
    text-align: center;
  }

  .ob-form {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .ob-field {
    position: relative;
  }

  .ob-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(0,229,255,0.7);
    margin-bottom: 7px;
    display: block;
  }

  .ob-input {
    width: 100%;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.3);
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 16px;
    color: #E8D5A3;
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    -webkit-appearance: none;
  }

  .ob-input:focus {
    border-color: rgba(0,229,255,0.8);
    box-shadow: 0 0 12px rgba(0,229,255,0.2);
  }

  .ob-input::placeholder {
    color: rgba(255,255,255,0.18);
    font-size: 14px;
  }

  .ob-input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7) sepia(1) saturate(2) hue-rotate(160deg);
    opacity: 0.6;
  }

  /* 自定义年月日下拉 */
  .ob-date-row {
    display: flex;
    gap: 8px;
  }

  .ob-select {
    flex: 1;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.3);
    border-radius: 8px;
    padding: 13px 8px;
    font-size: 16px;
    color: #E8D5A3;
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 1px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    text-align: center;
    transition: border-color 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }

  .ob-select:focus {
    border-color: rgba(0,229,255,0.8);
    box-shadow: 0 0 12px rgba(0,229,255,0.2);
  }

  .ob-select option {
    background: #0a0a1e;
    color: #E8D5A3;
  }

  .ob-select.error {
    border-color: rgba(255,45,85,0.8);
  }

  .ob-hint {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    margin-top: 5px;
    letter-spacing: 1px;
  }

  .ob-btn {
    width: 100%;
    margin-top: 8px;
    height: 54px;
    border: none;
    border-radius: 27px;
    background: linear-gradient(135deg, #0a1a3a, #0d2d5e, #1a4a8a);
    color: #E8D5A3;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 5px;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 24px rgba(0,229,255,0.3), 0 0 48px rgba(0,229,255,0.1);
    transition: transform 0.15s, box-shadow 0.3s;
    outline: none;
    -webkit-tap-highlight-color: transparent;

    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px var(--deity-glow));
    display: block;
  }
  .combo-label {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--deity-primary);
    text-shadow: 0 0 10px var(--deity-glow);
    display: block;
    margin-top: 2px;
  }

  /* =====================================================
     3D TILT 神像
  ===================================================== */
  .deity-frame {
    perspective: 600px;
    cursor: pointer;
  }
  #deityTiltWrap {
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
    transform: rotateX(0deg) rotateY(0deg);
  }

  /* =====================================================
     养成系统 · 好感度星级
  ===================================================== */
  #deity-affinity-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    z-index: 20;
    margin-top: -6px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  #deity-affinity-bar.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .affinity-star {
    font-size: 11px;
    transition: all 0.3s ease;
    filter: grayscale(1) brightness(0.4);
  }
  .affinity-star.lit {
    filter: grayscale(0) brightness(1);
    text-shadow: 0 0 8px var(--deity-glow);
  }
  .affinity-level-label {
    font-size: 9px;
    color: var(--deity-primary);
    letter-spacing: 2px;
    opacity: 0.7;
    margin-left: 2px;
  }

  /* =====================================================
     成就弹出通知
  ===================================================== */
  #achievement-toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    z-index: 4000;
    max-width: 320px;
    width: calc(100vw - 40px);
    background: linear-gradient(135deg, #0a0a1a, #15002a);
    border: 1px solid rgba(255,215,0,0.6);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 0 30px rgba(255,215,0,0.3), 0 8px 32px rgba(0,0,0,0.5);
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease;
    opacity: 0;
    pointer-events: none;
  }
  #achievement-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .ach-icon { font-size: 28px; flex-shrink: 0; }
  .ach-text { flex: 1; }
  .ach-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255,215,0,0.7);
    margin-bottom: 2px;
  }
  .ach-name {
    font-size: 15px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .ach-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
    line-height: 1.5;
  }

  /* =====================================================
     稀有事件 · 神明显灵
  ===================================================== */
  #divine-reveal {
    position: fixed;
    inset: 0;
    z-index: 5000;
    pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%);
  }
  #divine-reveal.active {
    animation: divine-flash 2.5s ease forwards;
  }
  @keyframes divine-flash {
    0%   { opacity:0; }
    8%   { opacity:1; }
    20%  { opacity:0.3; }
    35%  { opacity:0.8; }
    55%  { opacity:0.1; }
    70%  { opacity:0.6; }
    100% { opacity:0; }
  }
  #divine-text {
    position: fixed;
    inset: 0;
    z-index: 5001;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  #divine-text.active {
    animation: divine-text-show 2.5s ease forwards;
  }
  @keyframes divine-text-show {
    0%   { opacity:0; transform:scale(0.5); }
    15%  { opacity:1; transform:scale(1.05); }
    80%  { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.1); }
  }
  .divine-icon { font-size: 80px; margin-bottom: 12px; filter: drop-shadow(0 0 30px white); }
  .divine-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #FFD700;
    text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 60px rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }
  .divine-sub {
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 0 12px rgba(255,255,255,0.5);
  }
  .divine-msg {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.8);
    margin-top: 16px;
    max-width: 280px;
    text-align: center;
    letter-spacing: 1px;
    line-height: 1.7;
  }

  /* =====================================================
     香火档案 Tab
  ===================================================== */
  #archive-btn {
    position: fixed;
    bottom: 28px;
    left: 16px;
    z-index: 200;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--deity-primary);
    border-radius: 24px;
    color: var(--deity-primary);
    font-size: 12px;
    padding: 10px 16px;
    cursor: pointer;
    letter-spacing: 1px;
    font-family: 'Noto Serif SC', serif;
    box-shadow: 0 4px 20px var(--deity-glow), 0 2px 8px rgba(0,0,0,0.4);
    transition: all 0.25s;
    -webkit-tap-highlight-color: transparent;
  }
  #archive-btn:hover { transform: scale(1.06); box-shadow: 0 6px 28px var(--deity-glow); }
  #archive-btn:active { transform: scale(0.94); }

  #archive-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2500;
    background: rgba(0,0,0,0);
    align-items: flex-end;
    justify-content: center;
  }
  #archive-overlay.active {
    display: flex;
    animation: overlay-bg-in 0.3s ease forwards;
  }
  #archive-overlay.closing {
    display: flex;
    animation: overlay-bg-out 0.25s ease forwards;
  }
  .archive-panel {
    background: linear-gradient(160deg, #08001a, #030010);
    border: 1px solid rgba(255,255,255,0.1);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px 20px 40px;
    transform: translateY(100%);
    transition: none;
  }
  #archive-overlay.active .archive-panel {
    animation: panel-slide-up 0.35s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }
  #archive-overlay.closing .archive-panel {
    animation: panel-slide-down 0.25s ease forwards;
  }
  @keyframes panel-slide-up {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  @keyframes panel-slide-down {
    from { transform: translateY(0); }
    to   { transform: translateY(100%); }
  }
  .archive-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .archive-title {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--deity-primary);
    text-shadow: 0 0 10px var(--deity-glow);
  }
  .archive-close {
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.06);
    border: none; border-radius: 50%;
    color: rgba(255,255,255,0.4);
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .archive-total {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    margin-bottom: 16px;
    text-align: center;
  }
  .archive-total span {
    color: var(--deity-primary);
    font-weight: 700;
    font-size: 20px;
    text-shadow: 0 0 8px var(--deity-glow);
  }
  .archive-deity-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .archive-deity-card.highlighted {
    border-color: rgba(255,215,0,0.4);
    box-shadow: 0 0 16px rgba(255,215,0,0.1);
  }
  .archive-deity-icon { font-size: 28px; flex-shrink: 0; }
  .archive-deity-info { flex: 1; }
  .archive-deity-name {
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .archive-deity-title-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    opacity: 0.7;
  }
  .archive-deity-stars {
    display: flex;
    gap: 3px;
    margin-bottom: 6px;
  }
  .archive-deity-stars span {
    font-size: 12px;
    transition: all 0.3s;
  }
  .archive-progress-wrap {
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    height: 4px;
    overflow: hidden;
    margin-top: 4px;
  }
  .archive-progress-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .archive-count {
    font-size: 22px;
    font-weight: 900;
    text-align: right;
    flex-shrink: 0;
  }
  .archive-count-label {
    font-size: 9px;
    letter-spacing: 1px;
    opacity: 0.5;
    text-align: right;
    margin-top: 2px;
  }
  .archive-ach-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .archive-ach-title {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 12px;
  }
  .archive-ach-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .archive-ach-badge {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.3s;
  }
  .archive-ach-badge.unlocked {
    border-color: rgba(255,215,0,0.4);
    color: #FFD700;
    background: rgba(255,215,0,0.06);
    text-shadow: 0 0 6px rgba(255,215,0,0.3);
  }
  .archive-streak {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 2px;
    margin-top: 12px;
    text-align: center;
  }
  .archive-streak b { color: #FF9800; }

  /* =====================================================
     存档码
  ===================================================== */
  .archive-save-section { padding-bottom: 8px; }
  .archive-save-desc {
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
    margin: 6px 0 12px;
    line-height: 1.6;
  }
  .archive-save-btns {
    display: flex;
    gap: 10px;
  }
  .archive-save-btn {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    padding: 10px 6px;
    cursor: pointer;
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 1px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .archive-save-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
  .archive-code-area {
    width: 100%;
    margin-top: 10px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    font-family: monospace;
    padding: 10px 12px;
    resize: none;
    height: 100px;
    line-height: 1.5;
    letter-spacing: 0.5px;
    word-break: break-all;
  }
  .archive-code-area:focus { outline: none; border-color: rgba(255,215,0,0.3); }
  .archive-copy-btn {
    margin-top: 8px;
    width: 100%;
    background: rgba(255,215,0,0.1);
    border: 1px solid rgba(255,215,0,0.4);
    border-radius: 10px;
    color: #FFD700;
    font-size: 13px;
    padding: 9px;
    cursor: pointer;
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 2px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .archive-copy-btn:active { transform: scale(0.95); }
  .archive-copy-tip {
    font-size: 11px;
    text-align: center;
    margin-top: 6px;
    letter-spacing: 1px;
    min-height: 16px;
    transition: opacity 0.3s;
  }
</style>
</head>
<body>

<!-- 解析动画覆盖层 -->
<div id="parsing-overlay">
  <div class="parsing-spinner">
    <div class="parsing-inner-ring"></div>
    <div class="parsing-icon">⛩️</div>
  </div>
  <div class="parsing-text">命盘解析中</div>
  <div class="parsing-progress"><div class="parsing-progress-bar" id="parsingBar"></div></div>
  <div class="parsing-step" id="parsingStep"></div>
</div>

<!-- 命盘录入页 -->
<div id="onboarding-screen">
  <div class="ob-scan-line"></div>
  <div class="ob-logo">⛩️</div>
  <div class="ob-title">赛博神殿</div>
  <div class="ob-subtitle">CYBER TEMPLE · 命盘解析系统</div>

  <div class="ob-form">
    <div class="ob-field">
      <span class="ob-label">◆ 您的名字</span>
      <input class="ob-input" id="ob-name" type="text" placeholder="请输入您的姓名" maxlength="10" autocomplete="off">
    </div>
    <div class="ob-field">
      <span class="ob-label">◆ 出生日期</span>
      <div class="ob-date-row">
        <select class="ob-select" id="ob-birth-year"><option value="">年</option></select>
        <select class="ob-select" id="ob-birth-month"><option value="">月</option></select>
        <select class="ob-select" id="ob-birth-day"><option value="">日</option></select>
      </div>
      <div class="ob-hint">系统将根据五行命盘推算今日最适神明</div>
    </div>
    <button class="ob-btn" onclick="submitOnboarding()">解 析 命 盘</button>
    <div class="ob-privacy">✦ 信息仅存于本机，不会上传 ✦</div>
  </div>
</div>

<!-- 修改信息按钮 -->
<button id="edit-profile-btn" onclick="resetProfile()">修改信息</button>

<div id="app-scroll">

<div class="grid-bg" id="gridBg"></div>
<canvas id="particles"></canvas>
<div id="flash-overlay"></div>

<!-- PWA 安装提示条 -->
<div id="install-bar">
  <span id="install-bar-icon">⛩️</span>
  <div id="install-bar-text">
    <div id="install-bar-text-main">添加到主屏幕</div>
    <div id="install-bar-text-sub">像App一样使用赛博神殿</div>
  </div>
  <button id="install-btn">立即安装</button>
  <button id="install-close">×</button>
</div>

<!-- 今日五行旺色标签 -->
<div id="today-wuxing-bar">
  <div class="wuxing-tag" id="todayWuxingTag">
    <span class="wx-dot" id="todayWxDot"></span>
    <span id="todayWxText"></span>
  </div>
</div>

<!-- 今日推荐 Banner -->
<div id="recommend-banner">
  <div class="rec-user-name" id="recUserName"></div>
  <div class="rec-card" id="recCard" onclick="bannerTap()">
    <div class="rec-icon-wrap" id="recIcon"></div>
    <div class="rec-content">
      <div class="rec-tag">◆ 今日命盘推荐</div>
      <div class="rec-name" id="recName"></div>
      <div class="rec-reason" id="recReason"></div>
      <div class="rec-reason" id="recDetail" style="opacity:0.65;font-size:11px;margin-top:3px;"></div>
    </div>
    <div class="rec-goto-arrow">↗</div>
  </div>
</div>

<!-- 分享按钮 -->
<button id="share-btn" onclick="openShare()">✦ 分享祈福</button>

<!-- 分享遮罩 -->
<div id="share-overlay">
  <div class="share-card" id="shareCard">
    <div class="share-card-logo" id="shareIcon"></div>
    <div class="share-card-site">赛博神殿 · CYBER TEMPLE</div>
    <div class="share-card-deity" id="shareDeityName"></div>
    <div class="share-card-reason" id="shareReason"></div>
    <div class="share-card-detail" id="shareDetail"></div>
    <div class="share-card-blessing" id="shareBlessing">按下祈福键，获取今日神明批示</div>
    <div class="share-card-footer">✦ 信息仅存于本机，不会上传 ✦</div>
    <div class="share-card-btns">
      <button class="share-copy-btn" onclick="copyShareText()">复制文字</button>
      <button class="share-close-btn" onclick="closeShare()">关 闭</button>
    </div>
  </div>
</div>

<!-- Combo 连击显示 -->
<div id="combo-display">
  <span class="combo-x">COMBO</span>
  <span class="combo-num" id="comboNum">2</span>
  <span class="combo-label" id="comboLabel">连 击</span>
</div>

<!-- 成就解锁通知 -->
<div id="achievement-toast">
  <div class="ach-icon" id="achIcon">🏆</div>
  <div class="ach-text">
    <div class="ach-title">◆ 成就解锁 ◆</div>
    <div class="ach-name" id="achName"></div>
    <div class="ach-desc" id="achDesc"></div>
  </div>
</div>

<!-- 稀有事件 · 神明显灵 -->
<div id="divine-reveal"></div>
<div id="divine-text">
  <div class="divine-icon" id="divineIcon"></div>
  <div class="divine-title" id="divineTitle"></div>
  <div class="divine-sub">神 明 显 灵</div>
  <div class="divine-msg" id="divineMsg"></div>
</div>

<!-- 香火档案按钮 -->
<button id="archive-btn" onclick="openArchive()">⛩ 香火档案</button>

<!-- 香火档案面板 -->
<div id="archive-overlay">
  <div class="archive-panel">
    <div class="archive-header">
      <div class="archive-title">⛩ 香 火 档 案</div>
      <button class="archive-close" onclick="closeArchive()">✕</button>
    </div>
    <div class="archive-total">累计总香火 <span id="archiveTotalCount">0</span> 炷</div>
    <div id="archive-deity-list"></div>
    <div class="archive-ach-section">
      <div class="archive-ach-title">◆ 解锁成就</div>
      <div class="archive-ach-list" id="archive-ach-list"></div>
    </div>
    <div class="archive-streak" id="archiveStreak"></div>

    <!-- 存档码区域 -->
    <div class="archive-save-section">
      <div class="archive-ach-title" style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">◆ 存档同步</div>
      <div class="archive-save-desc">导出存档码可在换设备/换浏览器后恢复全部记录</div>
      <div class="archive-save-btns">
        <button class="archive-save-btn" onclick="exportSaveCode()">📤 导出存档码</button>
        <button class="archive-save-btn" onclick="showImportArea()">📥 导入存档码</button>
      </div>
      <div id="save-code-box" style="display:none">
        <textarea id="save-code-text" class="archive-code-area" readonly onclick="this.select()"></textarea>
        <button class="archive-copy-btn" onclick="copySaveCode()">复制</button>
        <div id="copy-tip" class="archive-copy-tip"></div>
      </div>
      <div id="import-box" style="display:none">
        <textarea id="import-code-text" class="archive-code-area" placeholder="粘贴存档码到这里…"></textarea>
        <button class="archive-save-btn" style="width:100%;margin-top:8px" onclick="importSaveCode()">确认导入</button>
        <div id="import-tip" class="archive-copy-tip"></div>
      </div>
    </div>
  </div>
</div>

<!-- 赛博风确认对话框 -->
<div id="cyber-confirm">
  <div class="cyber-confirm-box">
    <div class="cyber-confirm-icon">⚠️</div>
    <div class="cyber-confirm-title" id="cyberConfirmTitle">确 认 操 作</div>
    <div class="cyber-confirm-msg" id="cyberConfirmMsg"></div>
    <div class="cyber-confirm-btns">
      <button class="cyber-confirm-ok" id="cyberConfirmOk">确 认</button>
      <button class="cyber-confirm-cancel" id="cyberConfirmCancel">取 消</button>
    </div>
  </div>
</div>

<!-- 左右切换导航 -->
<div class="nav-row">
  <div class="nav-arrow" id="prevBtn" onclick="prevDeity()">&#8249;</div>
  <div class="nav-center">
    <div class="nav-deity-name" id="navDeityName"></div>
    <div class="nav-dots" id="navDots"></div>
  </div>
  <div class="nav-arrow" id="nextBtn" onclick="nextDeity()">&#8250;</div>

// =====================================================
// 当前状态

let currentDeityIndex = 0;
let isCooldown = false;
let isSwitching = false; // 神明切换防竞态锁

// 每个神明独立计数
function getCount(id) { return parseInt(localStorage.getItem('cyber_count_' + id) || '0'); }
function addCount(id) {
  const n = getCount(id) + 1;
  localStorage.setItem('cyber_count_' + id, n);
  return n;
}

// =====================================================
// 粒子系统
// =====================================================
const canvas = document.getElementById('particles');
const pCtx = canvas.getContext('2d');
let particleList = [];

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor(burst, x, y, color) {
    this.burst = burst;
    if (burst) {
      this.x = x; this.y = y;
      this.vx = (Math.random() - 0.5) * 10;
      this.vy = (Math.random() - 0.5) * 10 - 2;
      this.size = Math.random() * 4 + 2;
      this.life = 1; this.decay = 0.02 + Math.random() * 0.02;
      this.color = color || '#FFD700';
    } else {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = -Math.random() * 0.4 - 0.1;
      this.size = Math.random() * 1.5 + 0.5;
      this.life = Math.random(); this.decay = 0.002 + Math.random() * 0.002;
      this.color = '#FFFFFF11';
    }
  }
  update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; if (this.burst) this.vy += 0.1; }
  draw() {
    pCtx.save(); pCtx.globalAlpha = this.life;
    pCtx.fillStyle = this.color; pCtx.shadowColor = this.color; pCtx.shadowBlur = 6;
    pCtx.beginPath(); pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); pCtx.fill();
    pCtx.restore();
  }
}

for (let i = 0; i < 50; i++) particleList.push(new Particle());

function animateParticles() {
  pCtx.clearRect(0, 0, canvas.width, canvas.height);
  particleList = particleList.filter(p => p.life > 0);
  if (particleList.filter(p => !p.burst).length < 50) particleList.push(new Particle());
  particleList.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// =====================================================
// 音效（Web Audio API）
// =====================================================
let audioCtx = null;
function getACtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

function playSound(deity) {
  const ctx = getACtx();
  const now = ctx.currentTime;
  const primaryFreqs = {
    caishen:  [523, 659, 784, 1047],
    yuelao:   [392, 494, 587, 784],
    wenchang: [440, 554, 659, 880],
    yaowang:  [349, 440, 523, 698],
    taibai:   [466, 587, 698, 932],
    ouhuang:  [523, 698, 880, 1047],
    tiangong: [396, 528, 660, 792],
    sanshan:  [330, 440, 550, 660],  // 大气厚重，五声音阶
    mazu:     [370, 494, 622, 831],  // 柔美流动，如海浪
  };

  // 低频冲击
  const osc1 = ctx.createOscillator();
  const g1 = ctx.createGain();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(60, now);
  osc1.frequency.exponentialRampToValueAtTime(30, now + 0.3);
  g1.gain.setValueAtTime(0.25, now); g1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc1.connect(g1); g1.connect(ctx.destination);
  osc1.start(now); osc1.stop(now + 0.4);

  // 霓虹电音
  const osc2 = ctx.createOscillator();
  const g2 = ctx.createGain();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(660, now + 0.05);
  osc2.frequency.exponentialRampToValueAtTime(1320, now + 0.2);
  g2.gain.setValueAtTime(0.12, now + 0.05); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc2.connect(g2); g2.connect(ctx.destination);
  osc2.start(now + 0.05); osc2.stop(now + 0.4);

  // 音阶（根据神明不同）
  const notes = primaryFreqs[deity] || primaryFreqs.caishen;
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.18, now + 0.2 + i * 0.07);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35 + i * 0.07);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + 0.2 + i * 0.07); osc.stop(now + 0.4 + i * 0.07);
  });

  // 尾音
  const osc3 = ctx.createOscillator();
  const g3 = ctx.createGain();
  osc3.type = 'triangle';
  osc3.frequency.setValueAtTime(1800, now + 0.55);
  osc3.frequency.exponentialRampToValueAtTime(900, now + 0.85);
  g3.gain.setValueAtTime(0.2, now + 0.55); g3.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
  osc3.connect(g3); g3.connect(ctx.destination);
  osc3.start(now + 0.55); osc3.stop(now + 0.9);
}

// =====================================================
// 切换神明
// =====================================================
function switchDeity(index, direction = 'left', animate = true) {
  if (isSwitching) return;
  isSwitching = true;
  currentDeityIndex = index;
  const d = DEITIES[index];

  applyTheme(d);
  updateDots(index);

  // 导航区名称
  document.getElementById('navDeityName').textContent = d.icon + ' ' + d.name + ' · ' + d.tag;

  // 滑动动画
  const container = document.getElementById('mainContainer');
  if (animate) {
    container.classList.remove('slide-left', 'slide-right');
    void container.offsetWidth;
    container.classList.add(direction === 'left' ? 'slide-left' : 'slide-right');
    setTimeout(() => {
      container.classList.remove('slide-left', 'slide-right');
      isSwitching = false;
    }, 350);
  } else {
    isSwitching = false;
  }

  // H: 祝福语先fade-out，再更新内容
  const blessEl = document.getElementById('blessingText');
  const idleEl = document.getElementById('idleText');
  if (blessEl.classList.contains('show')) {
    blessEl.classList.add('blessing-fade-out');
    setTimeout(() => {
      blessEl.classList.remove('show', 'blessing-fade-out');
      blessEl.style.display = 'none';
      idleEl.style.display = 'block';
    }, 200);
  } else {
    blessEl.classList.remove('show');
    blessEl.style.display = 'none';
    idleEl.style.display = 'block';
  }

  // A: 内容区先淡出再淡入更新
  const titleArea = document.querySelector('.title-area');
  const statusBar = document.querySelector('.status-bar');
  const blessingBox = document.getElementById('blessingBox');

  [titleArea, statusBar, blessingBox].forEach(el => {
    if (!el) return;
    el.classList.remove('content-fade-in');
    el.classList.add('content-fade-out');
  });

  setTimeout(() => {
    // 更新文字内容
    document.getElementById('subtitleEl').textContent = d.subtitle;
    document.getElementById('titleEl').textContent = d.title;
    document.getElementById('titleEnEl').textContent = d.titleEn;
    document.getElementById('statusText').textContent = d.statusOnline;
    document.getElementById('blessingBox').setAttribute('data-label', d.blessingLabel);
    document.getElementById('idleText').textContent = d.idleText;
    document.getElementById('btnText').textContent = d.btnText;
    document.getElementById('footerDeco').textContent = d.footer;

    // 更新计数
    document.getElementById('countNum').textContent = getCount(d.id);

    // 更新神像
    document.getElementById('deityWrap').innerHTML = d.svgContent;

    [titleArea, statusBar, blessingBox].forEach(el => {
      if (!el) return;
      el.classList.remove('content-fade-out');
      el.classList.add('content-fade-in');
      setTimeout(() => el.classList.remove('content-fade-in'), 300);
    });
  }, 180);
}

function prevDeity() {
  if (isCooldown || isSwitching) return;
  const next = (currentDeityIndex - 1 + DEITIES.length) % DEITIES.length;
  switchDeity(next, 'right');
}

function nextDeity() {
  if (isCooldown || isSwitching) return;
  const next = (currentDeityIndex + 1) % DEITIES.length;
  switchDeity(next, 'left');
}

// 触摸滑动手势（绑定到滚动容器）
// =====================================================
let touchStartX = 0;
let touchStartY = 0;
let touchScrollY = 0;

const appScroll = document.getElementById('app-scroll');
(appScroll || document).addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchScrollY = appScroll ? appScroll.scrollTop : 0;
}, { passive: true });

(appScroll || document).addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const scrollDelta = appScroll ? Math.abs(appScroll.scrollTop - touchScrollY) : 0;
  // 只有横向滑动且没有明显垂直滚动时才切换神明
  if (scrollDelta < 10 && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) nextDeity();
    else prevDeity();
  }
}, { passive: true });

// 祈福逻辑
// =====================================================
function worship() {
  if (isCooldown) return;
  isCooldown = true;

  const d = DEITIES[currentDeityIndex];

  // 计数
  const n = addCount(d.id);
  const countDisplay = document.getElementById('countDisplay');
  document.getElementById('countNum').textContent = n;
  countDisplay.classList.remove('count-bounce');
  void countDisplay.offsetWidth;
  countDisplay.classList.add('count-bounce');
  setTimeout(() => countDisplay.classList.remove('count-bounce'), 500);

  // B: 按钮波纹Ripple效果
  const btn = document.getElementById('worshipBtn');
  const btnRect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple-effect';
  const size = Math.max(btnRect.width, btnRect.height) * 2;
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (btnRect.width / 2 - size / 2) + 'px';
  ripple.style.top = (btnRect.height / 2 - size / 2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);

  // B: 按下时btn-bg光晕收缩
  const btnBg = document.getElementById('btnBg');
  btnBg.style.transform = 'scale(0.93)';
  btnBg.style.boxShadow = '0 0 6px var(--deity-glow), inset 0 2px 8px rgba(0,0,0,0.4)';
  setTimeout(() => {
    btnBg.style.transform = '';
    btnBg.style.boxShadow = '';
  }, 200);

  // 音效
  playSound(d.id);

  // 闪光
  const flash = document.getElementById('flash-overlay');
  flash.style.background = d.colors.flashBg;
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 300);

  // 神像发光
  const wrap = document.getElementById('deityWrap');
  wrap.classList.add('blessed');
  setTimeout(() => wrap.classList.remove('blessed'), 800);

  // D: 光圈加速
  const haloOuter = document.getElementById('haloOuter');
  const haloInner = document.getElementById('haloInner');
  haloOuter.classList.add('praying');
  haloInner.classList.add('praying');
  setTimeout(() => {
    haloOuter.classList.remove('praying');
    haloInner.classList.remove('praying');
  }, 1200);

  // 特效
  const bx = btnRect.left + btnRect.width / 2;
  const by = btnRect.top;
  spawnFloaters(bx, by, d.floaters);
  spawnMatrix(d.matrixChars, d.colors.primary);
  spawnBurst(bx, by, d.colors.primary);

  // 状态文字
  document.getElementById('statusText').textContent = d.statusPraying;

  // 祝福语
  const idleEl = document.getElementById('idleText');
  const blessEl = document.getElementById('blessingText');
  idleEl.style.display = 'none';
  blessEl.classList.remove('show');
  blessEl.style.display = 'block';

  const blessing = d.blessings[Math.floor(Math.random() * d.blessings.length)];
  setTimeout(() => {
    blessEl.textContent = blessing;
    blessEl.classList.add('show');
    document.getElementById('statusText').textContent = d.statusDone;
    // 同步更新分享卡祝福语
    const shareBlessingEl = document.getElementById('shareBlessing');
    if (shareBlessingEl) shareBlessingEl.textContent = blessing;
  }, 500);

  // 冷却
  const cooldownOverlay = document.getElementById('btnCooldownOverlay');
  const cooldownRing = document.getElementById('worship-cooldown-ring');
  const cooldownArc = document.getElementById('cooldownArc');
  const COOLDOWN_MS = 1200;
  const PERIMETER = 512;

  cooldownOverlay.classList.add('active');
  cooldownRing.classList.add('active');
  cooldownArc.style.transition = `stroke-dashoffset ${COOLDOWN_MS}ms linear`;
  cooldownArc.style.strokeDashoffset = '0';

  setTimeout(() => {
    isCooldown = false;
    cooldownOverlay.classList.remove('active');
    cooldownRing.classList.remove('active');
    cooldownArc.style.transition = 'none';
    cooldownArc.style.strokeDashoffset = String(PERIMETER);
  }, COOLDOWN_MS);
}

// =====================================================
// 命盘系统 · 五行推荐算法
// =====================================================

// 五行：木0 火1 土2 金3 水4
const TIANGAN_WX = [0,0,1,1,2,2,3,3,4,4]; // 甲乙丙丁戊己庚辛壬癸
const DIZHI_WX   = [4,2,0,0,2,1,1,2,3,3,2,4]; // 子丑寅卯辰巳午未申酉戌亥

const WX_NAME = ['木','火','土','金','水'];
const WX_EMOJI_MAP = ['🌿','🔥','🟤','✨','💧'];

// 五行对应神明
const WX_TO_DEITY = {
  0: 'wenchang',
  1: 'taibai',
  2: 'tiangong',
  3: 'caishen',
  4: 'yuelao',
};

// 五行神明对应职能
const WX_DEITY_DESC = {
  0: { name: '文昌帝君', domain: '文思智慧、学业事业' },
  1: { name: '太白金星', domain: '事业腾飞、职场高升' },
  2: { name: '天公',     domain: '万事顺遂、四季平安' },
  3: { name: '财神爷',   domain: '财运亨通、金银滚滚' },
  4: { name: '月老',     domain: '姻缘红线、桃花喜缘' },
};

// 五行相生：生[i] = i所生的五行（木生火，火生土，土生金，金生水，水生木）
const WX_SHENG = [1, 2, 3, 4, 0]; // index=源，值=被生
// 五行相克：克[i] = i所克的五行（木克土，火克金，土克水，金克木，水克火）
const WX_KE = [2, 3, 4, 0, 1];

// 欧皇娘娘特殊触发
function checkOuhuang(name, birthDate) {
  const today = new Date();
  if (birthDate.getMonth() === today.getMonth() && birthDate.getDate() === today.getDate()) return true;
  if (/[福旺欧运吉]/u.test(name)) return true;
  return false;
}

// 药王特殊触发：出生月日与今日月日差 ≤7天
function checkYaowang(birthDate) {
  const today = new Date();
  const thisYearBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
  const prevYearBirthday = new Date(today.getFullYear() - 1, birthDate.getMonth(), birthDate.getDate());
  const nextYearBirthday = new Date(today.getFullYear() + 1, birthDate.getMonth(), birthDate.getDate());
  const minDiff = Math.min(
    Math.abs(today - thisYearBirthday),
    Math.abs(today - prevYearBirthday),
    Math.abs(today - nextYearBirthday)
  ) / 86400000;
  return minDiff <= 7;
}

// 计算命中缺失五行（返回数组，最少的）
function calcLackingWuxing(birthDate) {
  const year = birthDate.getFullYear();
  const month = birthDate.getMonth() + 1;
  const yearStem = ((year - 4) % 10 + 10) % 10;
  const yearBranch = ((year - 4) % 12 + 12) % 12;
  const monthBranchIndex = (month + 1) % 12;
  const monthStem = (((year - 4) % 5 + 5) % 5 * 2 + (month - 1)) % 10;
  const baseDate = new Date(1900, 0, 31);
  const diffDays = Math.floor((birthDate - baseDate) / 86400000);
  const dayStem = ((diffDays % 10) + 10) % 10;
  const dayBranch = ((diffDays % 12) + 12) % 12;
  const wxCount = [0, 0, 0, 0, 0];
  [yearStem, monthStem, dayStem].forEach(s => wxCount[TIANGAN_WX[s]]++);
  [yearBranch, monthBranchIndex, dayBranch].forEach(b => wxCount[DIZHI_WX[b]]++);
  const minVal = Math.min(...wxCount);
  return wxCount.map((v, i) => v === minVal ? i : -1).filter(i => i >= 0);
}

// 今日旺盛五行：(月+日) mod 5
function getTodayBoostWuxing() {
  const t = new Date();
  return (t.getMonth() + t.getDate()) % 5;
}

/**
 * 根据命中所缺五行 + 今日旺盛五行，计算推荐理由
 * 逻辑：
 *   1. 今日旺 = 命中缺 → 今日正是补缺最佳时机（直接旺）
 *   2. 今日旺 生 命中缺 → 今日天时助力，借势补缺（相生）
 *   3. 今日旺 克 命中缺 → 今日天时压制所缺，更需神明护体（相克急）
 *   4. 其他         → 命盘本缺，宜借神明之力填补（普通缺）
 */
function buildReason(lacking, todayBoost) {
  const todayName = WX_NAME[todayBoost];
  const todayEmoji = WX_EMOJI_MAP[todayBoost];

  // 优先：今日旺正是命中所缺
  if (lacking.includes(todayBoost)) {
    const desc = WX_DEITY_DESC[todayBoost];
    return {
      chosen: todayBoost,
      reason: `⚡ 命中缺${WX_NAME[todayBoost]}，今日${todayEmoji}${todayName}旺`,
      detail: `天时与命盘共鸣，今日是祈求${desc.name}的绝佳时机，宜${desc.domain}`
    };
  }

  // 今日旺 生 某缺失五行 → 借势
  for (const lack of lacking) {
    if (WX_SHENG[todayBoost] === lack) {
      const desc = WX_DEITY_DESC[lack];
      return {
        chosen: lack,
        reason: `✨ 命中缺${WX_NAME[lack]}，今日${todayEmoji}${todayName}旺生${WX_NAME[lack]}`,
        detail: `今日${todayName}气旺盛，五行相生助力，借势祈求${desc.name}，事半功倍，宜${desc.domain}`
      };
    }
  }

  // 今日旺 克 某缺失五行 → 急需护体
  for (const lack of lacking) {
    if (WX_KE[todayBoost] === lack) {
      const desc = WX_DEITY_DESC[lack];
      return {
        chosen: lack,
        reason: `🔺 命中缺${WX_NAME[lack]}，今日${todayEmoji}${todayName}旺克${WX_NAME[lack]}`,
        detail: `今日${todayName}气克压所缺，命中${WX_NAME[lack]}气更显不足，急需${desc.name}护体，宜${desc.domain}`
      };
    }
  }

  // 默认：命中缺，宜补
  const lack = lacking[0];
  const desc = WX_DEITY_DESC[lack];
  return {
    chosen: lack,
    reason: `⚡ 命中缺${WX_NAME[lack]}，${desc.name}感应`,
    detail: `命盘五行${WX_NAME[lack]}气不足，宜借${desc.name}之力填补，祈${desc.domain}`
  };
}

/**
 * 综合推荐算法
 */
function recommendDeity(name, birthDate) {
  // 特殊触发优先
  if (checkOuhuang(name, birthDate)) {
    return {
      deityId: 'ouhuang',
      reason: '✨ 欧皇娘娘感应到你的气场',
      detail: '今日欧气爆棚，命盘显示极强偏财运，宜求欧皇娘娘附身'
    };
  }
  if (checkYaowang(birthDate)) {
    return {
      deityId: 'yaowang',
      reason: '🌿 生辰将近，药王特感应',
      detail: '出生月日与今日相近，药王感召，宜求护体强身、百毒不侵'
    };
  }

  const lacking = calcLackingWuxing(birthDate);
  const todayBoost = getTodayBoostWuxing();
  const { chosen, reason, detail } = buildReason(lacking, todayBoost);

  return {
    deityId: WX_TO_DEITY[chosen],
    reason,
    detail
  };
}

function submitOnboarding() {
  const nameEl = document.getElementById('ob-name');
  const yearEl = document.getElementById('ob-birth-year');
  const monthEl = document.getElementById('ob-birth-month');
  const dayEl = document.getElementById('ob-birth-day');
  const name = nameEl.value.trim();
  const y = yearEl.value, m = monthEl.value, d = dayEl.value;
  const birthStr = (y && m && d) ? `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}` : '';

  if (!name) {
    nameEl.focus();
    nameEl.style.borderColor = 'rgba(255,45,85,0.8)';
    setTimeout(() => nameEl.style.borderColor = '', 1200);
    return;
  }
  if (!birthStr) {
    [yearEl, monthEl, dayEl].forEach(el => {
      if (!el.value) { el.classList.add('error'); setTimeout(() => el.classList.remove('error'), 1200); }
    });
    return;
  }

  // 显示解析动画
  const overlay = document.getElementById('parsing-overlay');
  overlay.style.display = 'flex';

  const bar = document.getElementById('parsingBar');
  const stepEl = document.getElementById('parsingStep');
  const steps = [
    `正在读取 ${name} 的生辰信息...`,
    `计算 ${name} 的天干地支...`,
    `分析五行命盘格局...`,
    `为 ${name} 匹配今日神明...`,
    `解析完成 ✓`
  ];

  // F: 赛博感进度条：先快速冲到75%，然后减速到92%，最后一次性完成
  let progress = 0;
  let stepIdx = 0;
  stepEl.textContent = steps[0];

  // 阶段1：快速冲到72%（前1.2s）
  // 阶段2：减速爬到92%（1.2s~2.2s）
  // 阶段3：短暂停顿后瞬间100%
  const phase1Target = 72;
  const phase2Target = 92;

  function getIncrement(p) {
    if (p < phase1Target) return 2.8;        // 快速
    if (p < phase2Target) return 0.55;       // 减速
    return 0;                                 // 等待爆发
  }

  const interval = setInterval(() => {
    const inc = getIncrement(progress);
    if (inc > 0) {
      progress = Math.min(progress + inc, phase2Target);
    }
    bar.style.width = progress + '%';
    const newStepIdx = Math.min(Math.floor(progress / 22), steps.length - 2);
    if (newStepIdx !== stepIdx) {
      stepIdx = newStepIdx;
      stepEl.textContent = steps[stepIdx];
    }
    if (progress >= phase2Target) {
      // 在92%卡顿一下，模拟"最后计算"
      clearInterval(interval);
      setTimeout(() => {
        // 爆发冲到100%
        bar.style.transition = 'width 0.25s cubic-bezier(0.4, 0, 0.2, 1)';
        bar.style.width = '100%';
        stepEl.textContent = steps[steps.length - 1];
        setTimeout(() => {
          bar.style.transition = '';
          overlay.style.display = 'none';

          saveUser(name, birthStr);
          const birthDate = new Date(birthStr + 'T00:00:00');
          const rec = recommendDeity(name, birthDate);
          saveRec(rec);

          // 先切换到推荐神明（无动画，直接到位）
          const targetIdx = DEITIES.findIndex(d => d.id === rec.deityId);
          if (targetIdx >= 0) switchDeity(targetIdx, 'left', false);

          // 隐藏录入页
          const screen = document.getElementById('onboarding-screen');
          screen.classList.add('hidden');
          setTimeout(() => { screen.style.display = 'none'; }, 650);

          showRecommendBanner({ name }, rec);
          showTodayWuxingBar();
          document.getElementById('edit-profile-btn').style.display = 'block';
        }, 300);
      }, 380);
    }
  }, 42); // ~42ms间隔，阶段1：72/(2.8/42*1000) ≈1.08s，阶段2更慢
}

function initUserSystem() {
  // 动态填充年份选项（1924 ~ 当年-3）
  const maxYear = new Date().getFullYear() - 3;
  const yearSel = document.getElementById('ob-birth-year');
  const monthSel = document.getElementById('ob-birth-month');
  const daySel = document.getElementById('ob-birth-day');

  for (let y = maxYear; y >= 1924; y--) {
    const o = document.createElement('option'); o.value = y; o.textContent = y + '年';
    yearSel.appendChild(o);
  }
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement('option'); o.value = m; o.textContent = m + '月';
    monthSel.appendChild(o);
  }
  function fillDays(year, month) {
    const cur = daySel.value;
    while (daySel.options.length > 1) daySel.remove(1);
    const days = year && month ? new Date(year, month, 0).getDate() : 31;
    for (let d = 1; d <= days; d++) {
      const o = document.createElement('option'); o.value = d; o.textContent = d + '日';
      daySel.appendChild(o);
    }
    if (cur && +cur <= days) daySel.value = cur;
  }
  fillDays();
  yearSel.addEventListener('change', () => fillDays(yearSel.value, monthSel.value));
  monthSel.addEventListener('change', () => fillDays(yearSel.value, monthSel.value));

  const user = getStoredUser();
  if (!user) {
    // 首次：显示录入页
    return;
  }
  // 老用户：直接隐藏录入页
  const screen = document.getElementById('onboarding-screen');
  screen.style.display = 'none';
  document.getElementById('edit-profile-btn').style.display = 'block';

  // 读取或重新计算今日推荐
  let rec = getStoredRec();
  if (!rec) {
    const birthDate = new Date(user.birth + 'T00:00:00');
    rec = recommendDeity(user.name, birthDate);
    saveRec(rec);
  }
  // 直接定位到推荐神明
  const targetIdx = DEITIES.findIndex(d => d.id === rec.deityId);
  if (targetIdx >= 0) switchDeity(targetIdx, 'left', false);

  showRecommendBanner(user, rec);
  showTodayWuxingBar();
}

    okBtn.removeEventListener('click', handleOk);
    cancelBtn.removeEventListener('click', handleCancel);
    dialog.removeEventListener('click', onBg);

  dialog.addEventListener('click', onBg);
}

function getAffinityData() {
  try { return JSON.parse(localStorage.getItem('cyber_affinity') || '{}'); }
  catch { return {}; }
}
function saveAffinityData(data) {
  localStorage.setItem('cyber_affinity', JSON.stringify(data));
}
function getDeityAffinity(id) {
  const d = getAffinityData();
  return d[id] || { count: 0, level: 0 };
}
function addDeityAffinity(id) {
  const data = getAffinityData();
  if (!data[id]) data[id] = { count: 0, level: 0 };
  data[id].count++;
  // 升级检测
  const prevLevel = data[id].level;
  for (let i = AFFINITY_THRESHOLDS.length - 1; i >= 0; i--) {
    if (data[id].count >= AFFINITY_THRESHOLDS[i]) {
      data[id].level = i + 1;
      break;
    }
    if (i === 0 && data[id].count < AFFINITY_THRESHOLDS[0]) {
      data[id].level = 0;
    }
  }
  const leveled = data[id].level > prevLevel;
  saveAffinityData(data);
  return { count: data[id].count, level: data[id].level, leveled, prevLevel };
}

let comboCount = 0;

function triggerCombo() {
  comboCount++;
  clearTimeout(comboTimer);

  if (comboCount >= 2) {
    const display = document.getElementById('combo-display');

    else if (comboCount >= 10) { labelEl.textContent = 'MAX  COMBO'; display.style.color='#FFD700'; }
    else if (comboCount >= 5)  { labelEl.textContent = '香 火 鼎 盛'; display.style.color='#E040FB'; }
    else                       { labelEl.textContent = '连  击'; display.style.color=''; }

    display.classList.remove('show', 'hide');
    void display.offsetWidth;
    display.classList.add('show');
  }

  comboTimer = setTimeout(() => {
    if (comboCount >= 2) {
      const display = document.getElementById('combo-display');
      display.classList.remove('show');
      display.classList.add('hide');
    }
    comboCount = 0;
  }, COMBO_WINDOW);

  // combo升调音效
  if (comboCount >= 3) playComboSound(comboCount);
}

function playComboSound(count) {
  try {
    const ctx = getACtx();
    const now = ctx.currentTime;
    const baseFreq = Math.min(200 + count * 40, 1200);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.15);
    g.gain.setValueAtTime(0.15, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.25);
  } catch(e) {}
}

function initTilt() {
  const frame = document.getElementById('deityFrame');
  const wrap = document.getElementById('deityTiltWrap');
  if (!frame || !wrap) return;

  function applyTilt(x, y) {
    const rect = frame.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (x - cx) / (rect.width / 2);   // -1 ~ 1
    const dy = (y - cy) / (rect.height / 2);  // -1 ~ 1
    const rx = -dy * 18; // pitch
    const ry =  dx * 18; // yaw
    wrap.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  }

  function resetTilt() {
    wrap.style.transition = 'transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)';
    wrap.style.transform = 'rotateX(0deg) rotateY(0deg)';
    setTimeout(() => { wrap.style.transition = 'transform 0.1s ease-out'; }, 500);
  }

  // 鼠标
  frame.addEventListener('mousemove', e => applyTilt(e.clientX, e.clientY));
  frame.addEventListener('mouseleave', resetTilt);

  // 触摸
  frame.addEventListener('touchmove', e => {
    const t = e.touches[0];
    applyTilt(t.clientX, t.clientY);
  }, { passive: true });
  frame.addEventListener('touchend', resetTilt);

  // 陀螺仪（手机倾斜）
  window.addEventListener('deviceorientation', e => {
    if (e.beta == null) return;
    const rx = Math.max(-18, Math.min(18, (e.beta - 45) * 0.4));
    const ry = Math.max(-18, Math.min(18, e.gamma * 0.4));
    wrap.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  });
}

// ★ 稀有事件 · 神明显灵（每100次触发）
// =====================================================

  yuelao:   ['月老现身！你的红线已亲手绑定，缘分天注定！', '月老显灵，此人姻缘大旺，真爱触手可及！'],
  wenchang: ['文昌显灵！智慧之光已降临，学业无往不利！', '文昌帝君现身加持，此人才华横溢，金榜题名！'],
  yaowang:  ['药王降世！神药已入体，百毒不侵，健康永驻！', '药王亲临，此人生命力大幅提升，百病全消！'],
  taibai:   ['太白金星亲降！天庭已批复，升职加薪，马到成功！', '太白显灵，天庭诏书已下，此人前途无量！'],
  ouhuang:  ['欧皇娘娘降临！天选之人！今日运气爆棚无上限！', '欧皇现身！宇宙欧气全部加持于你，逢赌必赢！'],
  tiangong: ['天公显灵！玉皇大帝亲自降福，万事顺遂！', '天庭圣旨降下！此人今年厄运全消，鸿运当头！'],
};

function triggerDivineReveal(deityId) {
  const d = DEITIES.find(x => x.id === deityId);
  if (!d) return;
  const msgs = DIVINE_MSGS[deityId] || ['神明显灵！大吉大利！'];
  const msg = msgs[Math.floor(Math.random() * msgs.length)];

  document.getElementById('divineIcon').textContent = d.icon;
  document.getElementById('divineTitle').textContent = '— ' + d.name + ' —';
  document.getElementById('divineMsg').textContent = msg;

  const revealEl = document.getElementById('divine-reveal');
  const textEl = document.getElementById('divine-text');
  revealEl.style.background = `radial-gradient(circle at center, ${d.colors.primary}cc 0%, rgba(255,255,255,0) 70%)`;

  revealEl.classList.remove('active');
  textEl.classList.remove('active');
  void revealEl.offsetWidth;
  revealEl.classList.add('active');
  textEl.classList.add('active');

  // 震动
  if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
  // 大量粒子爆炸
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      spawnBurst(innerWidth / 2, innerHeight / 2, d.colors.primary);
      spawnBurst(innerWidth / 2, innerHeight / 2, '#FFFFFF');
    }, i * 300);
  }
  setTimeout(() => {
    revealEl.classList.remove('active');
    textEl.classList.remove('active');
  }, 2600);
}

// =====================================================
// ★ 香火档案面板
// =====================================================
function openArchive() {
  const overlay = document.getElementById('archive-overlay');
  renderArchive();
  overlay.classList.remove('closing');
  overlay.classList.add('active');
}
function closeArchive() {
  const overlay = document.getElementById('archive-overlay');
  overlay.classList.add('closing');
  setTimeout(() => overlay.classList.remove('active', 'closing'), 250);
}
document.getElementById('archive-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeArchive();
});

function renderArchive() {
  const aff = getAffinityData();
  const unlocked = getUnlockedAch();
  const streak = getStreak();

  // 总计
  const total = DEITIES.reduce((s, d) => s + getCount(d.id), 0);
  document.getElementById('archiveTotalCount').textContent = total;

  // 神明列表
  const listEl = document.getElementById('archive-deity-list');
  listEl.innerHTML = '';
  const sortedDeities = [...DEITIES].sort((a, b) => getCount(b.id) - getCount(a.id));
  sortedDeities.forEach(d => {
    const cnt = getCount(d.id);
    const affData = aff[d.id] || { count: 0, level: 0 };
    const level = affData.level;
    const nextThresh = level < 5 ? AFFINITY_THRESHOLDS[level] : AFFINITY_THRESHOLDS[4];
    const prevThresh = level > 0 ? AFFINITY_THRESHOLDS[level - 1] : 0;
    const progress = level >= 5 ? 100 : Math.min(100, ((cnt - prevThresh) / (nextThresh - prevThresh)) * 100);
    const titles = AFFINITY_TITLES[d.id] || [];
    const titleLabel = level > 0 ? titles[level - 1] : '尚未结缘';
    const color = d.colors.primary;

    const card = document.createElement('div');
    card.className = 'archive-deity-card' + (d.id === DEITIES[currentDeityIndex].id ? ' highlighted' : '');
    card.style.borderColor = cnt > 0 ? `${color}40` : '';
    card.innerHTML = `
      <div class="archive-deity-icon">${d.icon}</div>
      <div class="archive-deity-info">
        <div class="archive-deity-name" style="color:${color};text-shadow:0 0 8px ${d.colors.glow}">${d.name}</div>
        <div class="archive-deity-title-label" style="color:${color}">${titleLabel}</div>
        <div class="archive-deity-stars">
          ${[0,1,2,3,4].map(i => `<span style="color:${i < level ? color : 'rgba(255,255,255,0.15)'}; text-shadow:${i < level ? '0 0 6px ' + color : 'none'}">★</span>`).join('')}
        </div>
        <div class="archive-progress-wrap">
          <div class="archive-progress-bar" style="width:${progress}%;background:${color};box-shadow:0 0 6px ${d.colors.glow}"></div>
        </div>
      </div>
      <div>
        <div class="archive-count" style="color:${color};text-shadow:0 0 8px ${d.colors.glow}">${cnt}</div>
        <div class="archive-count-label" style="color:${color}">香 炷</div>
      </div>`;
    listEl.appendChild(card);
  });

  // 成就
  const achListEl = document.getElementById('archive-ach-list');
  achListEl.innerHTML = '';
  ACHIEVEMENTS.forEach(ach => {
    const isUnlocked = unlocked.includes(ach.id);
    const badge = document.createElement('div');
    badge.className = 'archive-ach-badge' + (isUnlocked ? ' unlocked' : '');
    badge.innerHTML = `<span>${isUnlocked ? ach.icon : '🔒'}</span><span>${ach.name}</span>`;
    badge.title = ach.desc;
    achListEl.appendChild(badge);
  });

  // 连续天数
  const streakEl = document.getElementById('archiveStreak');
  streakEl.innerHTML = streak.days > 0
    ? `连续祈福 <b>${streak.days}</b> 天 · 功德无量`
    : '今日尚未祈福';
}

// =====================================================
// ★ 将养成逻辑接入 worship() 函数
// =====================================================
// 通过重写 addCount 来注入养成逻辑（worship内部调用addCount，动态查找）
window._originalAddCount = addCount;
window.addCount = function(id) {
  const n = window._originalAddCount(id);

  // 1. 养成：香火值 + 好感度
  const result = addDeityAffinity(id);
  updateAffinityDisplay(id);

  // 2. 签到
  updateStreak();

  // 3. Combo
  triggerCombo();

  // 4. 震动
  if (navigator.vibrate) navigator.vibrate(15);

  // 5. 升级提示
  if (result.leveled) {
    const d = DEITIES.find(x => x.id === id);
    const titles = AFFINITY_TITLES[id] || [];
    setTimeout(() => showAchievementToast({
      icon: '⭐',
      name: `好感度升至 ${result.level} 星！`,
      desc: `${d ? d.name : ''} · ${titles[result.level - 1] || ''}`
    }), 800);
  }

  // 6. 稀有事件：每100次
  if (n % 100 === 0) {
    setTimeout(() => triggerDivineReveal(id), 600);
  }

  // 7. 成就检测
  setTimeout(() => checkAndUnlockAch(showAchievementToast), 400);

  return n;
};

// =====================================================
// ★ 切换神明时刷新好感度星星
// =====================================================
const _originalSwitchDeity = switchDeity;
switchDeity = function(index, direction, animate) {
  _originalSwitchDeity(index, direction, animate);
  setTimeout(() => updateAffinityDisplay(DEITIES[index]?.id), 50);
};

// =====================================================
// ★ 存档码导出 / 导入
// =====================================================
const SAVE_KEYS = [
  'cyber_affinity',
  'cyber_streak',
  'cyber_achievements',
  // 各神明计数（格式：cyber_count_<id>）
  ...(() => { try { return Object.keys(localStorage).filter(k => k.startsWith('cyber_count_')); } catch { return []; } })()
];

function getAllSaveKeys() {
  const fixed = ['cyber_affinity', 'cyber_streak', 'cyber_achievements'];
  const counts = Object.keys(localStorage).filter(k => k.startsWith('cyber_count_'));
  return [...new Set([...fixed, ...counts])];
}

function exportSaveCode() {
  const data = {};
  getAllSaveKeys().forEach(k => {
    const v = localStorage.getItem(k);
    if (v !== null) data[k] = v;
  });
  const json = JSON.stringify(data);
  // btoa不支持中文，用自定义编码
  const code = btoa(unescape(encodeURIComponent(json)));

  const box = document.getElementById('save-code-box');
  const txt = document.getElementById('save-code-text');
  const importBox = document.getElementById('import-box');
  importBox.style.display = 'none';
  txt.value = code;
  box.style.display = 'block';
  txt.select();
  document.getElementById('copy-tip').textContent = '';
}

function copySaveCode() {
  const txt = document.getElementById('save-code-text');
  txt.select();
  const tip = document.getElementById('copy-tip');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt.value).then(() => {
      tip.style.color = '#4CAF50';
      tip.textContent = '✓ 已复制！粘贴到新设备即可恢复';
      setTimeout(() => tip.textContent = '', 3000);
    }).catch(() => fallbackCopy(txt, tip));
  } else {
    fallbackCopy(txt, tip);
  }
}

function fallbackCopy(txt, tip) {
  try {
    document.execCommand('copy');
    tip.style.color = '#4CAF50';
    tip.textContent = '✓ 已复制！';
    setTimeout(() => tip.textContent = '', 3000);
  } catch {
    tip.style.color = '#FF5252';
    tip.textContent = '请手动长按全选复制';
  }
}

function showImportArea() {
  const box = document.getElementById('import-box');
  const saveBox = document.getElementById('save-code-box');
  saveBox.style.display = 'none';
  document.getElementById('import-code-text').value = '';
  document.getElementById('import-tip').textContent = '';
  box.style.display = 'block';
}

function importSaveCode() {
  const code = document.getElementById('import-code-text').value.trim();
  const tip = document.getElementById('import-tip');
  if (!code) {
    tip.style.color = '#FF5252';
    tip.textContent = '请先粘贴存档码';
    return;
  }
  try {
    const json = decodeURIComponent(escape(atob(code)));
    const data = JSON.parse(json);
    // 验证格式
    if (typeof data !== 'object') throw new Error('格式错误');
    // 写入
    Object.entries(data).forEach(([k, v]) => {
      if (k.startsWith('cyber_')) localStorage.setItem(k, v);
    });
    tip.style.color = '#4CAF50';
    tip.textContent = '✓ 存档恢复成功！刷新页面生效';
    setTimeout(() => {
      document.getElementById('import-box').style.display = 'none';
      closeArchive();
      // 刷新显示
      updateAffinityDisplay(DEITIES[currentDeityIndex]?.id);
      renderArchive();
      // 刷新计数
      const d = DEITIES[currentDeityIndex];
      if (d) document.getElementById('countNum').textContent = getCount(d.id);
    }, 1200);
  } catch(e) {
    tip.style.color = '#FF5252';
    tip.textContent = '存档码无效，请检查是否完整复制';
  }
}

// =====================================================
// ★ 启动新系统
// =====================================================
initTilt();
// 初始化好感度显示
updateAffinityDisplay(DEITIES[currentDeityIndex]?.id);
// 初始化连续天数（如果今天已有祈福记录则算签到）
if (DEITIES.some(d => getCount(d.id) > 0)) updateStreak();

</script>
