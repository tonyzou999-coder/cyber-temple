<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>赛博神殿 · CyberTemple</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="赛博神殿">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="赛博朋克风格祈福应用，财神·月老·天公，一键祈福">
<style>
  :root {
    --c1: #FFD700;
    --c2: #FF2D55;
    --c3: #00FFFF;
    --bg: #050010;
    --deity-hue: 40;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Noto Serif SC', 'Songti SC', serif;
    overflow-x: hidden;
    position: relative;
    transition: background 0.6s ease;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
    transition: background-image 0.6s;
  }

  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  #flash-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 5;
    transition: opacity 0.15s;
    border-radius: 0;
  }
  #flash-overlay.active { opacity: 1; }

  /* ===== 左右切换导航 ===== */
  .nav-row {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 14px 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-arrow {
    width: 44px;
    height: 44px;
    border: 1px solid var(--deity-border);
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    color: var(--deity-primary);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 10px var(--deity-glow);
    flex-shrink: 0;
  }

  .nav-arrow:hover { background: rgba(255,255,255,0.08); transform: scale(1.1); }
  .nav-arrow:active { transform: scale(0.92); }

  .nav-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    padding: 0 10px;
  }

  .nav-deity-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--deity-primary);
    text-shadow: 0 0 10px var(--deity-glow);
    letter-spacing: 2px;
    transition: all 0.4s;
  }

  /* 指示点 */
  .nav-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .nav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .nav-dot.active {
    width: 18px;
    border-radius: 3px;
    background: var(--deity-primary);
    box-shadow: 0 0 8px var(--deity-primary);
  }

  /* ===== 主体容器 ===== */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 12px 16px 24px;
    max-width: 420px;
    width: 100%;
  }

  /* ===== 标题区 ===== */
  .title-area { text-align: center; }

  .subtitle {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--deity-secondary);
    text-shadow: 0 0 8px var(--deity-secondary);
    margin-bottom: 6px;
    opacity: 0.8;
    transition: all 0.5s;
  }

  .title {
    font-size: 36px;
    font-weight: 900;
    line-height: 1.1;
    transition: all 0.5s;
    background: linear-gradient(160deg, #ffffff 30%, var(--deity-primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 18px var(--deity-glow)) drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  }

  .title-en {
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 4px;
    color: var(--deity-primary);
    opacity: 0.5;
    transition: all 0.5s;
  }

  /* ===== 神像区 ===== */
  .deity-frame {
    position: relative;
    width: 200px;
    height: 200px;
  }

  .halo-outer {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    animation: halo-spin 4s linear infinite;
    transition: background 0.6s;
  }

  .halo-outer::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    background: var(--deity-halo) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: destination-out;
    mask-composite: exclude;
  }

  .halo-inner {
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid var(--deity-primary);
    opacity: 0.3;
    box-shadow: inset 0 0 30px var(--deity-glow);
    transition: all 0.6s;
  }

  @keyframes halo-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .deity-inner {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1a0a2e, #050010);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: background 0.6s;
  }

  .deity-svg-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    transition: filter 0.3s;
  }

  .deity-svg-wrap.blessed {
    filter: drop-shadow(0 0 20px var(--deity-primary)) drop-shadow(0 0 40px var(--deity-glow));
    animation: deity-glow-anim 0.5s ease-out;
  }

  @keyframes deity-glow-anim {
    0% { transform: scale(1); }
    30% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  .deity-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deity-img.visible { opacity: 1; }

  .count-display {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    border: 1px solid var(--deity-primary);
    border-radius: 20px;
    padding: 3px 14px;
    font-size: 10px;
    color: var(--deity-primary);
    white-space: nowrap;
    text-shadow: 0 0 6px var(--deity-primary);
    box-shadow: 0 0 10px var(--deity-glow);
    transition: all 0.5s;
  }

  /* ===== 状态栏 ===== */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--deity-secondary);
    opacity: 0.7;
    letter-spacing: 2px;
    transition: all 0.5s;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--deity-secondary);
    box-shadow: 0 0 6px var(--deity-secondary);
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* ===== 祝福语区 ===== */
  .blessing-box {
    width: 100%;
    min-height: 84px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--deity-border);
    border-radius: 12px;
    padding: 16px 18px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.5s;
  }

  .blessing-box::before {
    content: attr(data-label);
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg);
    padding: 0 10px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--deity-secondary);
    text-shadow: 0 0 6px var(--deity-secondary);
    white-space: nowrap;
    transition: all 0.5s;
  }

  .blessing-idle {
    font-size: 12px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 3px;
    text-align: center;
  }

  .blessing-text {
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    color: var(--deity-primary);
    text-shadow: 0 0 12px var(--deity-glow);
    line-height: 1.7;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.5s ease;
    letter-spacing: 0.5px;
    display: none;
  }

  .blessing-text.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== 祈福按键 ===== */
  .btn-worship {
    position: relative;
    width: 190px;
    height: 60px;
    border: none;
    cursor: pointer;
    outline: none;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-bg {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    background: var(--deity-btn-bg);
    box-shadow: 0 0 20px var(--deity-glow), 0 0 40px var(--deity-shadow), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: all 0.3s ease;
  }

  .btn-border {
    position: absolute;
    inset: -2px;
    border-radius: 32px;
    background: var(--deity-btn-border);
    z-index: -1;
    animation: border-pulse 2s ease-in-out infinite;
  }

  @keyframes border-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  .btn-main-text {
    position: relative;
    z-index: 1;
    font-size: 20px;
    font-weight: 900;
    color: var(--deity-primary);
    text-shadow: 0 0 10px var(--deity-glow), 0 2px 4px rgba(0,0,0,0.5);
    letter-spacing: 4px;
    display: block;
    text-align: center;
    line-height: 60px;
    transition: all 0.5s;
  }

  .btn-worship:active .btn-bg {
    transform: scale(0.95);
    box-shadow: 0 0 8px var(--deity-glow), inset 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ===== 底部 ===== */
  .footer-deco {
    font-size: 10px;
    color: rgba(255,255,255,0.12);
    letter-spacing: 3px;
    text-align: center;
  }

  /* ===== 漂浮特效 ===== */
  .floater {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    animation: floater-up 2s ease-out forwards;
    font-size: 20px;
  }

  @keyframes floater-up {
    0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(-160px) rotate(540deg) scale(0.2); }
  }

  .matrix-drop {
    position: fixed;
    font-size: 14px;
    font-family: monospace;
    pointer-events: none;
    z-index: 3;
    animation: matrix-fall 1.5s linear forwards;
  }

  @keyframes matrix-fall {
    0% { opacity: 0.8; transform: translateY(-20px); }
    100% { opacity: 0; transform: translateY(80px); }
  }

  /* ===== 切换动画 ===== */
  .container.slide-left {
    animation: slide-from-right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .container.slide-right {
    animation: slide-from-left 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  @keyframes slide-from-right {
    0%  { opacity: 0; transform: translateX(40px) scale(0.97); }
    100%{ opacity: 1; transform: translateX(0) scale(1); }
  }
  @keyframes slide-from-left {
    0%  { opacity: 0; transform: translateX(-40px) scale(0.97); }
    100%{ opacity: 1; transform: translateX(0) scale(1); }
  }

  /* 响应式 */
  @media (max-width: 400px) {
    .deity-frame { width: 170px; height: 170px; }
    .title { font-size: 30px; }
    .nav-arrow { width: 38px; height: 38px; font-size: 16px; }
  }

  /* ===== 命盘录入页 ===== */
  #onboarding-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #03030f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  #onboarding-screen.hidden {
    opacity: 0;
    transform: scale(1.05);
    pointer-events: none;
  }

  .ob-scan-line {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,229,255,0.04) 2px, rgba(0,229,255,0.04) 4px
    );
    pointer-events: none;
    animation: scan-move 8s linear infinite;
  }

  @keyframes scan-move {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .ob-logo {
    font-size: 40px;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 16px rgba(255,215,0,0.6));
    animation: ob-float 3s ease-in-out infinite;
  }

  @keyframes ob-float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .ob-title {
    font-size: 22px;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 0 0 20px rgba(255,215,0,0.7);
    letter-spacing: 4px;
    text-align: center;
  }

  .ob-subtitle {
    font-size: 11px;
    color: rgba(0,229,255,0.7);
    letter-spacing: 3px;
    margin-top: 4px;
    margin-bottom: 28px;
    text-align: center;
  }

  .ob-form {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .ob-field {
    position: relative;
  }

  .ob-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(0,229,255,0.7);
    margin-bottom: 7px;
    display: block;
  }

  .ob-input {
    width: 100%;
    background: rgba(0,229,255,0.04);
    border: 1px solid rgba(0,229,255,0.3);
    border-radius: 8px;
    padding: 13px 16px;
    font-size: 16px;
    color: #E8D5A3;
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    -webkit-appearance: none;
  }

  .ob-input:focus {
    border-color: rgba(0,229,255,0.8);
    box-shadow: 0 0 12px rgba(0,229,255,0.2);
  }

  .ob-input::placeholder {
    color: rgba(255,255,255,0.18);
    font-size: 14px;
  }

  .ob-input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.7) sepia(1) saturate(2) hue-rotate(160deg);
    opacity: 0.6;
  }

  .ob-hint {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    margin-top: 5px;
    letter-spacing: 1px;
  }

  .ob-btn {
    width: 100%;
    margin-top: 8px;
    height: 54px;
    border: none;
    border-radius: 27px;
    background: linear-gradient(135deg, #0a1a3a, #0d2d5e, #1a4a8a);
    color: #E8D5A3;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 5px;
    font-family: 'Noto Serif SC', serif;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 24px rgba(0,229,255,0.3), 0 0 48px rgba(0,229,255,0.1);
    transition: transform 0.15s, box-shadow 0.3s;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .ob-btn::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 29px;
    background: linear-gradient(135deg, #E8D5A3, #00E5FF, #FFD700, #E8D5A3);
    z-index: -1;
    animation: border-pulse 2s ease-in-out infinite;
  }

  .ob-btn:active { transform: scale(0.96); }

  .ob-privacy {
    font-size: 10px;
    color: rgba(255,255,255,0.15);
    text-align: center;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* ===== 今日推荐 Banner ===== */
  #recommend-banner {
    display: none;
    width: 100%;
    max-width: 420px;
    position: relative;
    z-index: 10;
    margin: 0 16px;
    padding: 0 16px;
  }

  .rec-card {
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--rec-color, rgba(255,215,0,0.35));
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .rec-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at left, var(--rec-glow, rgba(255,215,0,0.08)), transparent 70%);
    pointer-events: none;
  }

  .rec-icon-wrap {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--rec-color, rgba(255,215,0,0.4));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 0 12px var(--rec-glow, rgba(255,215,0,0.3));
    animation: rec-pulse 3s ease-in-out infinite;
  }

  @keyframes rec-pulse {
    0%,100% { box-shadow: 0 0 8px var(--rec-glow, rgba(255,215,0,0.3)); }
    50% { box-shadow: 0 0 20px var(--rec-glow, rgba(255,215,0,0.5)); }
  }

  .rec-content { flex: 1; min-width: 0; }

  .rec-tag {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--rec-color, #FFD700);
    opacity: 0.7;
    margin-bottom: 2px;
  }

  .rec-name {
    font-size: 15px;
    font-weight: 900;
    color: var(--rec-color, #FFD700);
    text-shadow: 0 0 10px var(--rec-glow, rgba(255,215,0,0.5));
    letter-spacing: 2px;
  }

  .rec-reason {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    margin-top: 3px;
    line-height: 1.5;
    letter-spacing: 0.3px;
  }

  .rec-user-name {
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.3);
    margin-bottom: 5px;
  }

  /* ===== 今日五行旺色标签 ===== */
  #today-wuxing-bar {
    display: none;
    width: 100%;
    max-width: 420px;
    padding: 0 16px;
    position: relative;
    z-index: 10;
  }

  .wuxing-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.65);
    margin-bottom: 0;
  }

  .wuxing-tag .wx-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 6px currentColor;
  }

  /* ===== 修改信息按钮 ===== */
  #edit-profile-btn {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 200;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    padding: 5px 12px;
    cursor: pointer;
    letter-spacing: 1px;
    font-family: 'Noto Serif SC', serif;
    transition: all 0.2s;
    display: none;
    -webkit-tap-highlight-color: transparent;
  }

  #edit-profile-btn:hover {
    border-color: rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.75);
  }

  /* ===== 解析动画覆盖层 ===== */
  #parsing-overlay {
    position: fixed;
    inset: 0;
    z-index: 1100;
    background: #03030f;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .parsing-spinner {
    position: relative;
    width: 80px;
    height: 80px;
  }

  .parsing-spinner::before,
  .parsing-spinner::after {
    content: '';
    position: absolute;
    border-radius: 50%;
  }

  .parsing-spinner::before {
    inset: 0;
    border: 2px solid rgba(0,229,255,0.15);
  }

  .parsing-spinner::after {
    inset: 0;
    border: 2px solid transparent;
    border-top-color: #00E5FF;
    border-right-color: rgba(0,229,255,0.4);

    border-left-color: rgba(255,215,0,0.4);
    animation: spinner-spin 1.4s linear infinite reverse;

    inset: 0;

    align-items: center;
    justify-content: center;
    font-size: 28px;
    animation: ob-float 2s ease-in-out infinite;

  @keyframes spinner-spin {
    to { transform: rotate(360deg); }

  .parsing-text {
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(0,229,255,0.8);
    text-shadow: 0 0 12px rgba(0,229,255,0.5);
    animation: parsing-blink 1.2s ease-in-out infinite;
  }

  @keyframes parsing-blink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .parsing-progress {
    width: 200px;
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }

  .parsing-progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #00E5FF, #FFD700);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
    box-shadow: 0 0 8px rgba(0,229,255,0.6);
  }

  .parsing-step {

// 每个神明独立计数
function getCount(id) { return parseInt(localStorage.getItem('cyber_count_' + id) || '0'); }

  const n = getCount(id) + 1;
  localStorage.setItem('cyber_count_' + id, n);

// =====================================================
// 粒子系统
// =====================================================
const canvas = document.getElementById('particles');
const pCtx = canvas.getContext('2d');
let particleList = [];

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor(burst, x, y, color) {
    this.burst = burst;
    if (burst) {
      this.x = x; this.y = y;
      this.vx = (Math.random() - 0.5) * 10;
      this.vy = (Math.random() - 0.5) * 10 - 2;
      this.size = Math.random() * 4 + 2;
      this.life = 1; this.decay = 0.02 + Math.random() * 0.02;
      this.color = color || '#FFD700';
    } else {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = -Math.random() * 0.4 - 0.1;
      this.size = Math.random() * 1.5 + 0.5;
      this.life = Math.random(); this.decay = 0.002 + Math.random() * 0.002;
      this.color = '#FFFFFF11';
    }
  }
  update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; if (this.burst) this.vy += 0.1; }
  draw() {
    pCtx.save(); pCtx.globalAlpha = this.life;
    pCtx.fillStyle = this.color; pCtx.shadowColor = this.color; pCtx.shadowBlur = 6;
    pCtx.beginPath(); pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); pCtx.fill();
    pCtx.restore();
  }
}

for (let i = 0; i < 50; i++) particleList.push(new Particle());

function animateParticles() {
  pCtx.clearRect(0, 0, canvas.width, canvas.height);
  particleList = particleList.filter(p => p.life > 0);
  if (particleList.filter(p => !p.burst).length < 50) particleList.push(new Particle());
  particleList.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// =====================================================
// 音效（Web Audio API）
// =====================================================
let audioCtx = null;
function getACtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

function playSound(deity) {
  const ctx = getACtx();
  const now = ctx.currentTime;
  const primaryFreqs = {
    caishen: [523, 659, 784, 1047],
    yuelao: [392, 494, 587, 784],
    wenchang: [440, 554, 659, 880],
    yaowang: [349, 440, 523, 698],
    taibai: [466, 587, 698, 932],
    ouhuang: [523, 698, 880, 1047],
  };

  // 低频冲击
  const osc1 = ctx.createOscillator();
  const g1 = ctx.createGain();
  osc1.type = 'sawtooth';
  osc1.frequency.setValueAtTime(60, now);
  osc1.frequency.exponentialRampToValueAtTime(30, now + 0.3);
  g1.gain.setValueAtTime(0.25, now); g1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc1.connect(g1); g1.connect(ctx.destination);
  osc1.start(now); osc1.stop(now + 0.4);

  // 霓虹电音
  const osc2 = ctx.createOscillator();
  const g2 = ctx.createGain();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(660, now + 0.05);
  osc2.frequency.exponentialRampToValueAtTime(1320, now + 0.2);
  g2.gain.setValueAtTime(0.12, now + 0.05); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
  osc2.connect(g2); g2.connect(ctx.destination);
  osc2.start(now + 0.05); osc2.stop(now + 0.4);

  // 音阶（根据神明不同）
  const notes = primaryFreqs[deity] || primaryFreqs.caishen;
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.18, now + 0.2 + i * 0.07);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.35 + i * 0.07);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(now + 0.2 + i * 0.07); osc.stop(now + 0.4 + i * 0.07);
  });

  // 尾音
  const osc3 = ctx.createOscillator();
  const g3 = ctx.createGain();
  osc3.type = 'triangle';
  osc3.frequency.setValueAtTime(1800, now + 0.55);
  osc3.frequency.exponentialRampToValueAtTime(900, now + 0.85);
  g3.gain.setValueAtTime(0.2, now + 0.55); g3.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
  osc3.connect(g3); g3.connect(ctx.destination);
  osc3.start(now + 0.55); osc3.stop(now + 0.9);
}

function spawnFloaters(x, y, list) {
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = list[Math.floor(Math.random() * list.length)];
    el.style.left = (x + (Math.random() - 0.5) * 130) + 'px';
    el.style.top = (y + (Math.random() - 0.5) * 70) + 'px';
    el.style.animationDelay = (Math.random() * 0.3) + 's';
    el.style.fontSize = (15 + Math.random() * 12) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  }
}

function spawnMatrix(chars, color) {
  const cArr = chars.split('');
  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'matrix-drop';
    el.textContent = cArr[Math.floor(Math.random() * cArr.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = Math.random() * 80 + 'vh';
    el.style.color = color;
    el.style.textShadow = '0 0 6px ' + color;
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

function spawnBurst(x, y, color) {
  for (let i = 0; i < 35; i++) particleList.push(new Particle(true, x, y, color));
}

function applyTheme(d) {
  const c = d.colors;
  const root = document.documentElement;
  root.style.setProperty('--deity-primary', c.primary);
  root.style.setProperty('--deity-secondary', c.secondary);
  root.style.setProperty('--deity-glow', c.glow);
  root.style.setProperty('--deity-shadow', c.shadow);
  root.style.setProperty('--deity-border', c.border);
  root.style.setProperty('--deity-halo', c.halo);
  root.style.setProperty('--deity-btn-bg', c.btnBg);
  root.style.setProperty('--deity-btn-border', c.btnBorder);
  root.style.setProperty('--bg', c.bg);
  document.body.style.background = c.bg;
}

// =====================================================
function initDots() {
  const dots = document.getElementById('navDots');
  DEITIES.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
    dot.addEventListener('click', () => {
      if (isCooldown || i === currentDeityIndex) return;
      switchDeity(i, i > currentDeityIndex ? 'left' : 'right');
    });
    dots.appendChild(dot);
  });
}

function updateDots(index) {
  document.querySelectorAll('.nav-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === index);
  });
}

// =====================================================
// 切换神明
// =====================================================
function switchDeity(index, direction = 'left', animate = true) {
  currentDeityIndex = index;
  const d = DEITIES[index];

  applyTheme(d);
  updateDots(index);

  // 导航区名称
  document.getElementById('navDeityName').textContent = d.icon + ' ' + d.name + ' · ' + d.tag;

  // 滑动动画
  const container = document.getElementById('mainContainer');
  if (animate) {
    container.classList.remove('slide-left', 'slide-right');
    void container.offsetWidth;
    container.classList.add(direction === 'left' ? 'slide-left' : 'slide-right');
    setTimeout(() => container.classList.remove('slide-left', 'slide-right'), 350);
  }

  // 更新文字内容
  document.getElementById('subtitleEl').textContent = d.subtitle;
  document.getElementById('titleEl').textContent = d.title;
  document.getElementById('titleEnEl').textContent = d.titleEn;
  document.getElementById('statusText').textContent = d.statusOnline;
  document.getElementById('blessingBox').setAttribute('data-label', d.blessingLabel);
  document.getElementById('idleText').textContent = d.idleText;
  document.getElementById('btnText').textContent = d.btnText;
  document.getElementById('footerDeco').textContent = d.footer;

  // 重置祝福语
  const blessEl = document.getElementById('blessingText');
  const idleEl = document.getElementById('idleText');
  blessEl.classList.remove('show');
  blessEl.style.display = 'none';
  idleEl.style.display = 'block';

  // 更新计数
  document.getElementById('countNum').textContent = getCount(d.id);

  // 更新神像
  document.getElementById('deityWrap').innerHTML = d.svgContent;
}

function prevDeity() {
  if (isCooldown) return;
  const next = (currentDeityIndex - 1 + DEITIES.length) % DEITIES.length;
  switchDeity(next, 'right');
}

function nextDeity() {
  if (isCooldown) return;
  const next = (currentDeityIndex + 1) % DEITIES.length;
  switchDeity(next, 'left');
}

// =====================================================
// 触摸滑动手势
// =====================================================
let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0) nextDeity();
    else prevDeity();
  }
}, { passive: true });

// 祈福逻辑
// =====================================================
function worship() {
  if (isCooldown) return;
  isCooldown = true;

  const d = DEITIES[currentDeityIndex];

  // 计数
  const n = addCount(d.id);
  document.getElementById('countNum').textContent = n;

  // 音效
  playSound(d.id);

  // 闪光
  const flash = document.getElementById('flash-overlay');
  flash.style.background = d.colors.flashBg;
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 300);

  // 神像发光
  const wrap = document.getElementById('deityWrap');
  wrap.classList.add('blessed');
  setTimeout(() => wrap.classList.remove('blessed'), 800);

  // 特效
  const btn = document.getElementById('worshipBtn');
  const rect = btn.getBoundingClientRect();
  const bx = rect.left + rect.width / 2;
  const by = rect.top;
  spawnFloaters(bx, by, d.floaters);
  spawnMatrix(d.matrixChars, d.colors.primary);
  spawnBurst(bx, by, d.colors.primary);

  // 状态文字
  document.getElementById('statusText').textContent = d.statusPraying;

  // 祝福语
  const idleEl = document.getElementById('idleText');
  const blessEl = document.getElementById('blessingText');
  idleEl.style.display = 'none';
  blessEl.classList.remove('show');
  blessEl.style.display = 'block';

  const blessing = d.blessings[Math.floor(Math.random() * d.blessings.length)];
  setTimeout(() => {
    blessEl.textContent = blessing;
    blessEl.classList.add('show');
    document.getElementById('statusText').textContent = d.statusDone;
  }, 500);

  // 冷却
  setTimeout(() => { isCooldown = false; }, 2000);
}

// 键盘支持
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); worship(); }
  if (e.code === 'ArrowLeft') prevDeity();
  if (e.code === 'ArrowRight') nextDeity();
});

  const today = new Date();
  if (birthDate.getMonth() === today.getMonth() && birthDate.getDate() === today.getDate()) return true;
  if (/[福旺欧运吉]/u.test(name)) return true;
  return false;
}

// 药王特殊触发：出生月日与今日月日差 ≤7天
function checkYaowang(birthDate) {
  const today = new Date();
  const thisYearBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
  const prevYearBirthday = new Date(today.getFullYear() - 1, birthDate.getMonth(), birthDate.getDate());
  const nextYearBirthday = new Date(today.getFullYear() + 1, birthDate.getMonth(), birthDate.getDate());
  const minDiff = Math.min(
    Math.abs(today - thisYearBirthday),
    Math.abs(today - prevYearBirthday),
    Math.abs(today - nextYearBirthday)
  ) / 86400000;
  return minDiff <= 7;
}

// 计算命中缺失五行（返回数组，最少的）
function calcLackingWuxing(birthDate) {
  const year = birthDate.getFullYear();
  const month = birthDate.getMonth() + 1;
  const yearStem = ((year - 4) % 10 + 10) % 10;
  const yearBranch = ((year - 4) % 12 + 12) % 12;
  const monthBranchIndex = (month + 1) % 12;
  const monthStem = (((year - 4) % 5 + 5) % 5 * 2 + (month - 1)) % 10;
  const baseDate = new Date(1900, 0, 31);
  const diffDays = Math.floor((birthDate - baseDate) / 86400000);
  const dayStem = ((diffDays % 10) + 10) % 10;
  const dayBranch = ((diffDays % 12) + 12) % 12;
  const wxCount = [0, 0, 0, 0, 0];
  [yearStem, monthStem, dayStem].forEach(s => wxCount[TIANGAN_WX[s]]++);
  [yearBranch, monthBranchIndex, dayBranch].forEach(b => wxCount[DIZHI_WX[b]]++);
  const minVal = Math.min(...wxCount);
  return wxCount.map((v, i) => v === minVal ? i : -1).filter(i => i >= 0);
}

// 今日旺盛五行：(月+日) mod 5
function getTodayBoostWuxing() {
  const t = new Date();
  return (t.getMonth() + t.getDate()) % 5;
}

/**
 * 根据命中所缺五行 + 今日旺盛五行，计算推荐理由
 * 逻辑：
 *   1. 今日旺 = 命中缺 → 今日正是补缺最佳时机（直接旺）
 *   2. 今日旺 生 命中缺 → 今日天时助力，借势补缺（相生）
 *   3. 今日旺 克 命中缺 → 今日天时压制所缺，更需神明护体（相克急）
 *   4. 其他         → 命盘本缺，宜借神明之力填补（普通缺）
 */
function buildReason(lacking, todayBoost) {
  const todayName = WX_NAME[todayBoost];
  const todayEmoji = WX_EMOJI_MAP[todayBoost];

  // 优先：今日旺正是命中所缺
  if (lacking.includes(todayBoost)) {
    const desc = WX_DEITY_DESC[todayBoost];
    return {
      chosen: todayBoost,
      reason: `⚡ 命中缺${WX_NAME[todayBoost]}，今日${todayEmoji}${todayName}旺`,
      detail: `天时与命盘共鸣，今日是祈求${desc.name}的绝佳时机，宜${desc.domain}`
    };
  }

  // 今日旺 生 某缺失五行 → 借势
  for (const lack of lacking) {
    if (WX_SHENG[todayBoost] === lack) {
      const desc = WX_DEITY_DESC[lack];
      return {
        chosen: lack,
        reason: `✨ 命中缺${WX_NAME[lack]}，今日${todayEmoji}${todayName}旺生${WX_NAME[lack]}`,
        detail: `今日${todayName}气旺盛，五行相生助力，借势祈求${desc.name}，事半功倍，宜${desc.domain}`
      };
    }
  }

  // 今日旺 克 某缺失五行 → 急需护体
  for (const lack of lacking) {
    if (WX_KE[todayBoost] === lack) {
      const desc = WX_DEITY_DESC[lack];
      return {
        chosen: lack,
        reason: `🔺 命中缺${WX_NAME[lack]}，今日${todayEmoji}${todayName}旺克${WX_NAME[lack]}`,
        detail: `今日${todayName}气克压所缺，命中${WX_NAME[lack]}气更显不足，急需${desc.name}护体，宜${desc.domain}`
      };
    }
  }

  // 默认：命中缺，宜补
  const lack = lacking[0];
  const desc = WX_DEITY_DESC[lack];
  return {
    chosen: lack,
    reason: `⚡ 命中缺${WX_NAME[lack]}，${desc.name}感应`,
    detail: `命盘五行${WX_NAME[lack]}气不足，宜借${desc.name}之力填补，祈${desc.domain}`
  };
}

/**
 * 综合推荐算法
 */
function recommendDeity(name, birthDate) {
  // 特殊触发优先
  if (checkOuhuang(name, birthDate)) {
    return {
      deityId: 'ouhuang',
      reason: '✨ 欧皇娘娘感应到你的气场',
      detail: '今日欧气爆棚，命盘显示极强偏财运，宜求欧皇娘娘附身'
    };
  }
  if (checkYaowang(birthDate)) {
    return {
      deityId: 'yaowang',
      reason: '🌿 生辰将近，药王特感应',
      detail: '出生月日与今日相近，药王感召，宜求护体强身、百毒不侵'
    };
  }

  const lacking = calcLackingWuxing(birthDate);
  const todayBoost = getTodayBoostWuxing();
  const { chosen, reason, detail } = buildReason(lacking, todayBoost);

  return {
    deityId: WX_TO_DEITY[chosen],
    reason,
    detail
  };
}

// =====================================================
// 命盘存储与 UI
// =====================================================

let recommendedDeityIndex = -1;

function getStoredUser() {
  try {
    const raw = localStorage.getItem('cyber_user_profile');
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveUser(name, birthStr) {
  localStorage.setItem('cyber_user_profile', JSON.stringify({ name, birth: birthStr }));
}

function getTodayKey() {
  const t = new Date();
  return `${t.getFullYear()}-${t.getMonth()+1}-${t.getDate()}`;
}

function getStoredRec() {
  try {
    const raw = localStorage.getItem('cyber_today_rec');
    if (!raw) return null;
    const rec = JSON.parse(raw);
    if (rec.date !== getTodayKey()) return null;
    return rec;
  } catch { return null; }
}

function saveRec(rec) {
  localStorage.setItem('cyber_today_rec', JSON.stringify({ date: getTodayKey(), ...rec }));
}

function showRecommendBanner(user, rec) {
  const deityIndex = DEITIES.findIndex(d => d.id === rec.deityId);
  if (deityIndex < 0) return;
  recommendedDeityIndex = deityIndex;
  const d = DEITIES[deityIndex];

  const banner = document.getElementById('recommend-banner');
  const card = document.getElementById('recCard');

  // 设置颜色变量
  card.style.setProperty('--rec-color', d.colors.primary);
  card.style.setProperty('--rec-glow', d.colors.glow);

  document.getElementById('recUserName').textContent = `◈ ${user.name} 的今日命盘`;
  document.getElementById('recIcon').textContent = d.icon;
  document.getElementById('recName').textContent = d.name;
  document.getElementById('recReason').textContent = rec.reason;
  document.getElementById('recDetail').textContent = rec.detail;
  banner.style.display = 'block';
  // 淡入动画
  requestAnimationFrame(() => {
    requestAnimationFrame(() => banner.classList.add('visible'));
  });
}

function jumpToRecommended() {
  if (recommendedDeityIndex < 0) return;
  const dir = recommendedDeityIndex > currentDeityIndex ? 'left' : 'right';
  switchDeity(recommendedDeityIndex, dir);
  // 滚动到神明区
  document.getElementById('mainContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function submitOnboarding() {
  const nameEl = document.getElementById('ob-name');
  const birthEl = document.getElementById('ob-birth');
  const name = nameEl.value.trim();
  const birthStr = birthEl.value;

  if (!name) {
    nameEl.focus();
    nameEl.style.borderColor = 'rgba(255,45,85,0.8)';
    setTimeout(() => nameEl.style.borderColor = '', 1200);
    return;
  }
  if (!birthStr) {
    birthEl.focus();
    birthEl.style.borderColor = 'rgba(255,45,85,0.8)';
    setTimeout(() => birthEl.style.borderColor = '', 1200);
    return;
  }

  // 显示解析动画
  const overlay = document.getElementById('parsing-overlay');
  overlay.style.display = 'flex';

  const bar = document.getElementById('parsingBar');
  const stepEl = document.getElementById('parsingStep');
  const steps = [
    '正在读取生辰信息...',
    '计算天干地支...',
    '分析五行命盘...',
    '匹配今日神明...',
    '解析完成 ✓'
  ];

  let progress = 0;
  let stepIdx = 0;
  stepEl.textContent = steps[0];

  const interval = setInterval(() => {
    progress += 2;
    bar.style.width = progress + '%';
    const newStepIdx = Math.min(Math.floor(progress / 22), steps.length - 1);
    if (newStepIdx !== stepIdx) {
      stepIdx = newStepIdx;
      stepEl.textContent = steps[stepIdx];
    }
    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => {
        overlay.style.display = 'none';

        saveUser(name, birthStr);
        const birthDate = new Date(birthStr + 'T00:00:00');
        const rec = recommendDeity(name, birthDate);
        saveRec(rec);

        // 先切换到推荐神明（无动画，直接到位）
        const targetIdx = DEITIES.findIndex(d => d.id === rec.deityId);
        if (targetIdx >= 0) switchDeity(targetIdx, 'left', false);

        // 隐藏录入页
        const screen = document.getElementById('onboarding-screen');
        screen.classList.add('hidden');
        setTimeout(() => { screen.style.display = 'none'; }, 650);

        showRecommendBanner({ name }, rec);
        showTodayWuxingBar();
        document.getElementById('edit-profile-btn').style.display = 'block';
      }, 300);
    }
  }, 50); // 50ms * 50次 = 2.5s
}

function initUserSystem() {
  // 动态设置日期 max（当年 - 3岁）
  const maxYear = new Date().getFullYear() - 3;
  document.getElementById('ob-birth').setAttribute('max', `${maxYear}-12-31`);

  const user = getStoredUser();
  if (!user) {
    // 首次：显示录入页
    return;
  }
  // 老用户：直接隐藏录入页
  const screen = document.getElementById('onboarding-screen');
  screen.style.display = 'none';
  document.getElementById('edit-profile-btn').style.display = 'block';

  // 读取或重新计算今日推荐
  let rec = getStoredRec();
  if (!rec) {
    const birthDate = new Date(user.birth + 'T00:00:00');
    rec = recommendDeity(user.name, birthDate);
    saveRec(rec);
  }
  // 直接定位到推荐神明
  const targetIdx = DEITIES.findIndex(d => d.id === rec.deityId);
  if (targetIdx >= 0) switchDeity(targetIdx, 'left', false);

  showRecommendBanner(user, rec);
  showTodayWuxingBar();
}

// 今日五行旺色
const WX_COLOR = ['#00C853','#FF4444','#D4A84B','#E8D5A3','#00BFFF'];

function showTodayWuxingBar() {
  const todayBoost = getTodayBoostWuxing();
  const bar = document.getElementById('today-wuxing-bar');
  const dot = document.getElementById('todayWxDot');
  const text = document.getElementById('todayWxText');

  const todayName = WX_NAME[todayBoost];
  const todayEmoji = WX_EMOJI_MAP[todayBoost];
  dot.style.backgroundColor = WX_COLOR[todayBoost];
  dot.style.color = WX_COLOR[todayBoost];
  text.textContent = `今日 ${todayEmoji} ${todayName}旺`;

  bar.style.display = 'block';
}

function resetProfile() {
  if (!confirm('确定要重新填写命盘信息吗？')) return;
  localStorage.removeItem('cyber_user_profile');
  localStorage.removeItem('cyber_today_rec');

  // 隐藏五行条和修改按钮
  document.getElementById('today-wuxing-bar').style.display = 'none';
  document.getElementById('edit-profile-btn').style.display = 'none';

  // 隐藏 banner
  const banner = document.getElementById('recommend-banner');
  banner.classList.remove('visible');
  setTimeout(() => { banner.style.display = 'none'; }, 600);

  // 重置输入框
  document.getElementById('ob-name').value = '';
  document.getElementById('ob-birth').value = '';

  // 显示录入页
  const screen = document.getElementById('onboarding-screen');
  screen.style.display = 'flex';
  screen.classList.remove('hidden');
}

// =====================================================
// 启动
// =====================================================
initDots();
switchDeity(0, 'left', false);
initUserSystem();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log('[PWA] Service Worker 注册成功'))
      .catch(e => console.log('[PWA] SW 注册失败:', e));
  });

// PWA 安装提示
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // 显示安装提示条
  const bar = document.getElementById('install-bar');
  if (bar) bar.style.display = 'flex';
});

document.getElementById('install-btn')?.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  if (outcome === 'accepted') {
    document.getElementById('install-bar').style.display = 'none';
  }
});

document.getElementById('install-close')?.addEventListener('click', () => {
  document.getElementById('install-bar').style.display = 'none';
});
</script>
